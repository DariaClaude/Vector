var CARDS2 = [{"c": "fin", "t": "Прибыль есть, денег нет", "b": "Прибыль в отчёте и деньги на счёте разные вещи. Компания умирает не от убытка, а от того, что в день выплаты зарплаты на счёте пусто.", "a": "Посмотрите кассовый прогноз на ближайшие 4 недели: есть ли неделя, где выплаты больше поступлений."}, {"c": "fin", "t": "Маржа по каждому юрлицу", "b": "Общая прибыль группы скрывает, что одно юрлицо кормит, а другое проедает. Пока считаете в сумме, вы не знаете, какой бизнес у вас на самом деле.", "a": "Запросите прибыль и маржу по каждому юрлицу и направлению за прошлый квартал отдельно."}, {"c": "fin", "t": "Отсрочка стоит денег", "b": "Отсрочка платежа клиенту это кредит, который вы ему выдаёте из своих денег. У кредита есть цена, и она должна быть в вашей цене.", "a": "Посчитайте, сколько денег компании сейчас заморожено в дебиторке и во что обходится их замещение."}, {"c": "fin", "t": "Бюджет как договор", "b": "Бюджет не прогноз, а договор: каждый директор подписался под своей строкой. Без владельца у строки нет и ответственности за отклонение.", "a": "Проверьте: у каждой статьи бюджета есть один человек, который отвечает за отклонение?"}, {"c": "fin", "t": "Точка безубыточности по объекту", "b": "Каждый объект клиента это маленький бизнес со своей выручкой и расходами. Пока не знаете, какие объекты убыточны, вы субсидируете их за счёт прибыльных.", "a": "Возьмите пять объектов и посчитайте маржу по каждому с учётом всех прямых затрат."}, {"c": "ops", "t": "Правило вместо решения", "b": "Каждое решение, которое пришло к вам повторно, должно стать правилом. Руководитель, принимающий одни и те же решения, не управляет, а обслуживает.", "a": "Выпишите десять решений этой недели и по каждому напишите правило, чтобы оно больше не приходило."}, {"c": "ops", "t": "Метрики процесса, не результата", "b": "Выручка говорит, что случилось. Метрики процесса говорят, что случится. Первое лицо смотрит на пять-семь показателей процесса еженедельно.", "a": "Определите пять метрик процесса, которые предсказывают выручку и маржу через месяц, и организуйте их еженедельный замер."}, {"c": "ops", "t": "Границы полномочий письменно", "b": "Пока границы полномочий не записаны, люди либо боятся решать, либо решают лишнее. Обе ошибки стоят денег.", "a": "Каждому руководителю напишите одним абзацем, какие решения он принимает без вас, и отправьте."}, {"c": "ops", "t": "Одна причина, а не десять случаев", "b": "Три срыва подряд это не три случая, а одна причина, которая ещё не найдена. Разбор по случаям утешает, разбор по причине лечит.", "a": "Возьмите последние три сбоя одного типа и найдите общую причину в процессе, а не в людях."}, {"c": "ops", "t": "Тест на отпуск", "b": "Компания, которая не работает две недели без вас, ещё не компания. Отпуск это не отдых, а аудит системы управления.", "a": "Запланируйте две недели без рабочих чатов и выпишите, что для этого должно быть готово."}, {"c": "sales", "t": "Лимит на одного клиента", "b": "Клиент, дающий больше четверти выручки, управляет вашей компанией сильнее, чем вы. Концентрация это риск, у которого должен быть лимит.", "a": "Посчитайте долю пяти крупнейших клиентов в выручке и назначьте лимит для одного клиента."}, {"c": "sales", "t": "План продаж считается снизу", "b": "План «рост на 40%» без разложения на сделки, лидов и людей это пожелание. План считается снизу: сколько сделок, откуда, кем.", "a": "Попросите разложить план продаж на сделки, лиды и загрузку менеджеров по месяцам."}, {"c": "sales", "t": "Ключевых клиентов ведёт первое лицо", "b": "Топ-3 клиента должны знать генерального директора лично. Отношения на уровне менеджера уходят вместе с менеджером.", "a": "Назначьте встречи с первыми лицами трёх крупнейших клиентов в ближайший месяц без повода продать."}, {"c": "sales", "t": "Исключение становится пакетом", "b": "Персональные условия одному клиенту рождают очередь за такими же. Выгодное исключение оформляется как пакет для сегмента, невыгодное не даётся никому.", "a": "Найдите три действующих исключения из прайса и решите по каждому: пакет для сегмента или отмена."}, {"c": "sales", "t": "Отток считается раньше притока", "b": "Новые клиенты дороже удержанных в несколько раз. Первое лицо смотрит на отток раньше, чем на воронку.", "a": "Посчитайте отток клиентов за год в деньгах и назовите его главную причину."}, {"c": "portfolio", "t": "Ближе к ядру", "b": "Новое направление тем дешевле и вероятнее, чем ближе оно к текущим клиентам, людям и процессам. Дальнее направление это другой бизнес, а не рост.", "a": "Оцените ближайшую идею нового направления по трём осям: те же клиенты, те же люди, те же процессы."}, {"c": "portfolio", "t": "Критерий остановки записан заранее", "b": "Направление закрывают не тогда, когда стало больно, а когда достигнута заранее записанная точка. Без точки убыточное живёт годами.", "a": "По каждому направлению кроме основного запишите: при какой цифре к какой дате оно закрывается."}, {"c": "portfolio", "t": "Что именно покупаем", "b": "Покупка компании это покупка клиентов, людей, процессов или бренда. Что из этого уйдёт после сделки, то вы не купили.", "a": "Для любой сделки или партнёрства, которое обсуждается, выпишите, что конкретно вы получаете и что из этого удержите."}, {"c": "portfolio", "t": "Деньги на одно", "b": "Три идеи и деньги на одну означают, что две идеи должны быть отвергнуты вслух. Финансировать все три понемногу значит убить все три.", "a": "Если у компании больше одного нового направления в работе, выберите одно и остановите остальные до результата."}, {"c": "portfolio", "t": "Стратегия группы на одной странице", "b": "Если стратегию группы нельзя изложить на одной странице, её нет. Одна страница: где выигрываем, от чего отказываемся, куда вкладываем, что должно случиться за год.", "a": "Напишите стратегию группы на одну страницу и дайте прочитать собственнику и директорам."}, {"c": "topteam", "t": "Нанимать сильнее себя", "b": "Директор, который знает свою область хуже вас, это ваш дополнительный отдел, а не директор. На уровне топа нанимают тех, у кого можно учиться.", "a": "Для ближайшего найма руководителя опишите, в чём он должен быть сильнее вас, и как это проверить."}, {"c": "topteam", "t": "Полномочия вместе с ответственностью", "b": "Ответственность без полномочий рождает исполнителя, который ждёт согласования. Полномочия без ответственности рождают хаос. Даются вместе и письменно.", "a": "Проверьте у каждого директора: совпадает ли то, за что он отвечает, с тем, что он может решать сам."}, {"c": "topteam", "t": "Замена себе", "b": "Пока вы незаменимы, вас не повысят: некому оставить. Первое лицо растит преемника с первого дня, а не когда собирается уходить.", "a": "Назовите человека, который мог бы заменить вас через два года, и что для этого должно с ним произойти."}, {"c": "topteam", "t": "Разные директора, одна метрика", "b": "Два директора ссорятся, потому что у каждого своя метрика и они противоречат друг другу. Общая метрика, за которую отвечают вместе, снимает конфликт лучше любых переговоров.", "a": "Найдите пару директоров, чьи цели конфликтуют, и назначьте им одну общую метрику."}, {"c": "topteam", "t": "Увольнение сильного", "b": "Результат, который держится на страхе, уходит вместе с людьми. Руководитель с цифрами и текучкой стоит компании больше, чем приносит.", "a": "Посчитайте цену текучки у самого «результативного» руководителя: найм, обучение, простои."}, {"c": "owner", "t": "Правила игры с собственником", "b": "Пока не записано, какие решения его, какие ваши, какие общие, он будет вмешиваться, а вы будете обижаться. Первое лицо предлагает правила, а не ждёт их.", "a": "Напишите собственнику предложение: три списка решений, его, ваши и совместные, и попросите обсудить."}, {"c": "owner", "t": "Плохие новости до отчёта", "b": "Собственник прощает провал, о котором узнал от вас первым. Провал, о котором узнал сам, он не прощает никогда.", "a": "Проверьте: есть ли сейчас факт, о котором собственнику лучше узнать от вас сегодня, а не из отчёта."}, {"c": "owner", "t": "Пилот против убыточной идеи", "b": "Собственнику не говорят «нет». Ему показывают расчёт, предлагают пилот с ограниченной ценой ошибки и фиксируют риски письменно.", "a": "Возьмите идею собственника, в которую вы не верите, и оформите её как пилот с ценой ошибки не выше 5% годовой прибыли."}, {"c": "owner", "t": "Отчёт, который снимает контроль", "b": "Собственник вмешивается, когда не видит. Регулярный короткий отчёт с деньгами, рисками и решениями заменяет его ежедневные звонки.", "a": "Придумайте еженедельный отчёт собственнику на половину страницы: деньги, риски, решения, что нужно от него."}, {"c": "owner", "t": "Обещать меньше, делать всё", "b": "Доверие собственника это отношение сделанного к обещанному, накопленное за годы. Одно невыполненное обещание весит больше трёх выполненных.", "a": "Соберите, что вы обещали собственнику за квартал, и отметьте, что выполнено полностью."}, {"c": "risk", "t": "Три риска, которые закроют компанию", "b": "Первое лицо знает три события, которые могут закрыть компанию за полгода, и по каждому есть план. Всё остальное операционка.", "a": "Напишите три риска, которые могут закрыть компанию за полгода, с вероятностью, ценой и планом."}, {"c": "risk", "t": "Юрлица как переборки", "b": "Несколько юрлиц имеют смысл только если проблема одного не топит остальные. Общие договоры, люди и счета превращают переборки в дыры.", "a": "Проверьте, что при претензии к одному юрлицу остальные не пострадают: договоры, счета, персонал, руководители."}, {"c": "risk", "t": "Первые два часа кризиса", "b": "В кризисе выигрывает тот, у кого план написан заранее. Первые два часа: факты, один голос, клиентам от нас, собственнику от нас.", "a": "Напишите план первых двух часов для трёх самых вероятных кризисов: кто что делает и кто говорит."}, {"c": "risk", "t": "Договоры, которые вас не защищают", "b": "Договор с клиентом это не формальность, а распределение риска. Если вы не знаете, что в нём написано про срывы, штрафы и расторжение, риск весь у вас.", "a": "Прочитайте типовой договор с клиентом на предмет: штрафы за срыв, срок расторжения, ответственность за персонал."}, {"c": "risk", "t": "Кассовый стресс-тест", "b": "Что будет, если два крупных клиента задержат оплату на месяц одновременно? Если ответа нет, у компании нет финансовой подушки, а есть надежда.", "a": "Смоделируйте: два крупнейших клиента платят на 30 дней позже. Хватит ли денег на ФОТ, и откуда возьмёте недостающее?"}, {"c": "scale", "t": "Порог решения", "b": "Первое лицо решает только то, что дороже порога и необратимо. Всё дешевле и обратимое решают люди в своих границах. Порог записан.", "a": "Две недели записывайте каждое решение, которое пришло к вам, с ценой ошибки, и назначьте порог."}, {"c": "scale", "t": "Календарь как стратегия", "b": "Календарь первого лица показывает настоящую стратегию лучше любого документа. Если в нём одни планёрки, компания управляется вручную.", "a": "Разберите прошлую неделю: сколько часов ушло на людей, на клиентов и стратегию, на операционку."}, {"c": "scale", "t": "Заместитель с правом ошибаться", "b": "Заместитель, который не может ошибиться без вашего разбора, не заместитель, а исполнитель. Право на ошибку в заданных пределах это и есть полномочие.", "a": "Определите, в каких пределах ваш заместитель может ошибаться без последствий, и скажите ему об этом."}, {"c": "scale", "t": "Энергия как ресурс компании", "b": "Первое лицо принимает решения на остатке энергии. Уставший руководитель откладывает, соглашается и ошибается. Энергия это актив компании, а не личное дело.", "a": "Найдите в неделе три вещи, которые съедают вашу энергию несоразмерно результату, и уберите одну."}, {"c": "scale", "t": "Год спустя", "b": "Первое лицо думает на год вперёд, пока все остальные на неделю. Вопрос «что должно быть через год» задаётся себе каждый месяц.", "a": "Напишите одну страницу: как выглядит компания через год, и что из этого требует вашего решения уже в этом месяце."}];
var DETAILS2 = {"Прибыль есть, денег нет": {"w": "Прибыль считается по актам: услугу оказали, выручка записана. А деньги приходят через 30, 60, 90 дней отсрочки. Зарплату персоналу вы платите сейчас. Между этими датами лежит кассовый разрыв, и он не виден в отчёте о прибыли.", "e": "В сентябре РМ Групп закрыла актов на 30 млн, прибыль по месяцу 4 млн. Но из этих 30 млн деньги придут в ноябре, а ФОТ персонала на объектах в 18 млн нужно выплатить 10 октября. Если на счёте меньше, прибыльная компания не платит людям. Кассовый прогноз показал бы это за месяц.", "s": ["Попросите у финансов таблицу по неделям: ожидаемые поступления от клиентов и обязательные выплаты.", "Найдите неделю с минимальным остатком. Если он отрицательный или меньше одной недели ФОТ, это сигнал.", "Решите, чем закрываете: ускорить дебиторку, сдвинуть выплаты поставщикам, кредитная линия."], "g": {"q": "На какой неделе ближайшего месяца остаток на счетах минимален, и хватает ли его на ФОТ?", "who": "Финансовому директору или главному бухгалтеру.", "ok": "Таблица по неделям с остатком; названа худшая неделя и источник покрытия, если остаток мал.", "proof": "Кассовый прогноз на 4-13 недель с фактическими датами платежей клиентов.", "go": "Дальше, если минимальный остаток покрывает две недели выплат. Если нет, план покрытия утверждается сегодня, а не в день выплаты."}}, "Маржа по каждому юрлицу": {"w": "Когда несколько юрлиц и направлений, соблазн смотреть на общую цифру. Но решения принимаются по частям: куда вкладывать, что закрывать, где поднимать цену. Без разбивки любое решение это угадывание.", "e": "Группа показывает 8% рентабельности за квартал. Разбивка: аутстаффинг складов 15%, аутсорсинг производств 9%, новое направление минус 12%. Общая цифра выглядит приемлемо, а на деле одно направление съедает половину прибыли двух других. Без разбивки вы бы продолжали его финансировать.", "s": ["Попросите финансы разнести выручку и все расходы по юрлицам и направлениям, включая общие (аренда, управление) по понятному правилу.", "Посчитайте маржу и рентабельность по каждому.", "Отметьте, где цифра ниже средней, и запишите вопрос: почему и что с этим делать."], "g": {"q": "Какая рентабельность у каждого юрлица и направления отдельно, и по какому правилу разнесены общие расходы?", "who": "Финансовому директору.", "ok": "Таблица по направлениям с выручкой, прямыми расходами, долей общих и рентабельностью; правило разнесения записано.", "proof": "Управленческий отчёт по направлениям за квартал.", "go": "Дальше, если разбивка есть и правило разнесения одно для всех периодов. Если общие расходы разнесены «на глаз», цифрам не верим, сначала договариваемся о правиле."}}, "Отсрочка стоит денег": {"w": "Клиент платит через 60 дней, а вы платите людям сейчас. Два месяца его деньги работают на него, а не на вас. Чтобы закрыть эту дыру, вы берёте кредит или замораживаете свои. И то и другое стоит процентов. Если этих процентов нет в цене, вы дарите клиенту деньги.", "e": "Средняя дебиторка РМ Групп 25 млн при отсрочке 45 дней. Кредитная линия под 20% годовых: замещение этих денег стоит около 400 тысяч в месяц. Это почти 5 млн в год, которых нет в цене. Клиент, просящий отсрочку 90 дней, просит ещё 3% от контракта в подарок. Либо в цену, либо факторинг за его счёт.", "s": ["Возьмите у финансов сумму дебиторки на сегодня и средний срок оплаты по факту, а не по договору.", "Умножьте сумму на ставку кредита и на долю года: это цена отсрочки в месяц.", "Сравните с маржой: сколько процентов маржи съедает отсрочка."], "g": {"q": "Сколько стоит компании отсрочка платежа в месяц, и заложена ли эта цена в прайс?", "who": "Финансовому директору, затем директору по продажам.", "ok": "Цифра в рублях в месяц и в процентах от маржи; ответ, есть ли она в ценообразовании.", "proof": "Отчёт по дебиторке с фактическими сроками; прайс или правила ценообразования.", "go": "Дальше, если цена отсрочки в прайсе есть или продажи получили правило: длиннее отсрочка, выше цена. Если нет, до пересмотра прайса новые отсрочки свыше 30 дней не подписываем."}}, "Бюджет как договор": {"w": "Бюджет, который составили финансы и утвердил собственник, никто не исполняет: он ничей. Бюджет становится инструментом, когда каждая статья закреплена за человеком, который её защищал, и с ним же разбирают отклонения.", "e": "Бюджет РМ Групп на год утверждён. В марте расходы на подбор персонала на 40% выше плана. Кто отвечает? HR говорит, что операции заказали больше людей; операции говорят, что продажи взяли объёмы. У строки нет владельца, и разбор превращается в спор. Правило: одна строка, один человек, ежемесячная сверка план-факт с ним.", "s": ["Возьмите бюджет на текущий год и напротив каждой крупной статьи напишите фамилию.", "Если у статьи два владельца или ни одного, это и есть проблема: назначьте одного.", "Введите ежемесячную сверку план-факт с владельцем каждой строки, где он объясняет отклонение и предлагает действие."], "g": {"q": "Кто отвечает за каждую крупную статью бюджета, и когда он объясняет отклонение?", "who": "Себе, затем каждому директору по его строкам.", "ok": "У каждой статьи один владелец, есть дата ежемесячной сверки, директора знают свои строки.", "proof": "Бюджет с колонкой «владелец»; протокол первой сверки план-факт.", "go": "Дальше, если владельцы назначены и первая сверка прошла. Если директора «не знали, что это их строка», бюджет пересобираем вместе с ними."}}, "Точка безубыточности по объекту": {"w": "На уровне компании маржа может быть хорошей, а внутри половина объектов работает в минус: далеко ехать, высокая текучка, штрафы за невыходы, низкая ставка. Вы этого не видите, пока считаете только общую цифру.", "e": "Пять объектов РМ Групп. Расчёт с учётом ставок, транспорта, координатора, замены, штрафов: три объекта дают 18-22% маржи, один 4%, один минус 7%. Убыточный объект держали «ради отношений с клиентом». Отношения стоят компании 300 тысяч в квартал. Теперь это осознанное решение или повод пересмотреть цену.", "s": ["Выберите пять объектов: два крупных, два средних, один проблемный.", "По каждому соберите за месяц: выручка, ФОТ персонала, транспорт, координатор, замены, штрафы, прочее.", "Посчитайте маржу и найдите объекты ниже 10%. По ним решение: цена, процесс или отказ."], "g": {"q": "Какие объекты работают ниже целевой маржи, и почему?", "who": "Финансовому директору и директору по операциям вместе.", "ok": "Таблица по объектам с маржой; по каждому объекту ниже порога записана причина и решение.", "proof": "Расчёт по объектам за месяц с прямыми затратами.", "go": "Дальше, если по убыточным объектам есть решение с датой. Если решение «оставить ради отношений», собственник должен его подтвердить, зная цену."}}, "Правило вместо решения": {"w": "Если координатор третий раз спрашивает, можно ли выводить людей клиенту с просрочкой, значит правила нет. Правило: просрочка до 10 дней выводим, свыше 10 дней только с подтверждением финансов. Записано, разослано, вопрос больше не приходит.", "e": "За неделю к генеральному директору РМ Групп пришли: три запроса на скидку, два вопроса про выход к должнику, четыре согласования найма координатора, один конфликт по графику. Все десять решаются правилами: лимит скидки директору по продажам, порог просрочки, бюджет найма в рамках штатки. Через месяц к вам приходит одно решение вместо десяти.", "s": ["Две недели записывайте каждое решение, которое пришло к вам: суть, кто принёс, сколько заняло времени.", "Сгруппируйте: что повторяется. Для каждой группы напишите правило в два-три предложения и назначьте, кто решает по нему.", "Разошлите правила и месяц следите, что повторные вопросы не приходят."], "g": {"q": "Какие решения ко мне приходят повторно, и какое правило их снимает?", "who": "Себе, затем руководителям, которые будут решать по правилам.", "ok": "Список повторяющихся решений, к каждому правило и владелец, правила разосланы.", "proof": "Журнал решений за две недели; документ с правилами.", "go": "Дальше, если через месяц повторных решений стало вдвое меньше. Если правила разосланы, а вопросы приходят, правила не работают: разбираем почему."}}, "Метрики процесса, не результата": {"w": "Выручка и прибыль это итог, на них уже нельзя повлиять. Число невыходов на смены, время замены, доля объектов с координатором, загрузка базы персонала, срок закрытия заявки клиента предсказывают, что будет с выручкой через месяц. Управлять можно только ими.", "e": "Панель генерального директора РМ Групп на понедельник: доля невыходов (цель ниже 5%), среднее время замены сотрудника (цель 2 часа), загрузка активной базы персонала (цель 80%), заявки клиентов, закрытые в срок (цель 95%), маржа по объектам ниже 10% (цель 0 объектов). Пять цифр за пять минут, и вы знаете, где проблема, до того, как она попадёт в выручку.", "s": ["Спросите себя: если бы я мог видеть только пять цифр про операции, какие бы предсказали проблемы раньше всего?", "Проверьте, можно ли их считать сейчас и кто это делает. Если нет данных, это первая задача.", "Договоритесь, что каждый понедельник эти пять цифр приходят вам одним сообщением с отметкой, что вне нормы."], "g": {"q": "Какие пять цифр процесса я вижу каждый понедельник, и какие из них вне нормы?", "who": "Директору по операциям.", "ok": "Пять метрик с нормами, источником данных и ответственным; первое сообщение получено.", "proof": "Еженедельная сводка; источники данных (CRM, учёт выходов).", "go": "Дальше, если сводка приходит две недели подряд и цифры сходятся с фактом. Если метрики считаются вручную по-разному, сначала фиксируем методику."}}, "Границы полномочий письменно": {"w": "«Ты отвечаешь за продажи» не говорит, может ли он дать скидку 15%, нанять менеджера, подписать договор с отсрочкой 60 дней. Пока это не записано, он либо приходит к вам, либо делает и потом получает выговор. Границы письменно снимают и то и другое.", "e": "Директору по продажам РМ Групп: «Без согласования: скидки до 10%, отсрочка до 30 дней, найм менеджеров в рамках штатного расписания, расходы до 100 тысяч в месяц. Со мной: скидки выше 10%, отсрочка свыше 30 дней, новые направления, увольнение руководителей. Собственник: сделки свыше 20 млн». Один абзац, и половина согласований исчезает.", "s": ["Выпишите руководителей, которые вам подчиняются напрямую.", "По каждому напишите три списка: решает сам, решает со мной, решает собственник. С цифрами и порогами.", "Отправьте каждому и попросите ответить, всё ли понятно и с чем не согласен."], "g": {"q": "Какие решения каждый мой руководитель принимает без меня, с какими порогами?", "who": "Каждому прямому подчинённому.", "ok": "У каждого руководителя письменные границы с цифрами; он подтвердил, что понял.", "proof": "Отправленные сообщения или документ; ответы руководителей.", "go": "Дальше, если границы отправлены всем и через месяц число согласований упало. Если руководитель продолжает носить решения из своей зоны, разбираем: он не доверяет границам или вы их нарушаете."}}, "Одна причина, а не десять случаев": {"w": "Когда срывается смена, хочется найти виноватого координатора. Но если срывы повторяются на разных объектах у разных людей, причина в процессе: подтверждение выхода накануне, резерв людей, мотивация. Поменять процесс дешевле, чем менять людей.", "e": "Три объекта РМ Групп за неделю: вышло меньше людей, чем заказано. Разбор по случаям: один координатор забыл позвонить, у другого заболели, у третьего люди ушли к конкуренту. Разбор по причине: ни на одном объекте нет резерва в 10% и подтверждения выхода вечером накануне. Одно правило снимает все три.", "s": ["Соберите три последних сбоя одного типа: даты, объекты, что произошло, кто участвовал.", "Спросите по каждому «почему» пять раз, пока не упрётесь в процесс, а не в человека.", "Найдите общее звено и предложите одно изменение процесса, которое закрыло бы все три."], "g": {"q": "Какая одна причина в процессе стоит за последними тремя сбоями?", "who": "Директору по операциям, с участниками сбоев.", "ok": "Названа причина в процессе (не «человеческий фактор»), предложено одно изменение, назначен ответственный и срок.", "proof": "Разбор трёх случаев с цепочкой причин; описание изменения процесса.", "go": "Дальше, если изменение внедрено и месяц без повторов. Если причина названа как «люди недобросовестные», разбор не закончен."}}, "Тест на отпуск": {"w": "Пока вы на связи, слабые места системы скрыты: любой вопрос решается звонком. Уход на две недели показывает, какие решения не имеют владельца, какие процессы не описаны, кто на самом деле тянет операционку. Это самый честный аудит из возможных.", "e": "Генеральный директор РМ Групп готовится к двум неделям без связи. Список того, что должно быть до отъезда: заместитель с правом подписи и порогами; правила по просрочке, скидкам, срывам; еженедельная сводка идёт ему, а не вам; собственник знает, к кому обращаться. То, что не успели, и есть дыры в системе, и их видно ещё до отъезда.", "s": ["Поставьте в календарь две недели без рабочих чатов минимум через два месяца.", "Напишите: какие решения могут прийти за это время и кто их принимает; какие процессы должны идти без вас.", "Всё, у чего нет ответа, включите в план подготовки. Это и есть список дыр в системе."], "g": {"q": "Что должно быть готово, чтобы компания две недели работала без меня?", "who": "Себе, затем заместителю и собственнику.", "ok": "Список решений с владельцами, правила по частым ситуациям, назначен заместитель с полномочиями, дата отъезда стоит.", "proof": "Документ подготовки; согласие собственника на формат.", "go": "Дальше, если список закрыт и дата не сдвинулась. Если отпуск переносится третий раз «из-за ситуации», система не готова, и это диагноз."}}, "Лимит на одного клиента": {"w": "Когда один клиент даёт 40%, его уход это кассовый разрыв, простой персонала и увольнения. Он это знает и давит по цене. Лимит доли (обычно 20-25%) не запрещает работать с крупным клиентом, а обязывает растить остальных быстрее, чем его.", "e": "Топ-5 клиентов РМ Групп: 38%, 14%, 9%, 7%, 6%. Первый клиент фактически определяет судьбу компании. Правило: доля одного клиента не выше 25%, значит за год нужно вырастить остальную выручку так, чтобы он стал 25% без потери объёма с ним. Это цель для коммерческого директора, и она измерима.", "s": ["Возьмите выручку по клиентам за последние 12 месяцев и отсортируйте по убыванию.", "Посчитайте долю каждого из топ-5 и накопленную долю.", "Назначьте лимит и посчитайте, на сколько должна вырасти остальная выручка, чтобы в него уложиться."], "g": {"q": "Какова доля крупнейшего клиента, и какой рост остальных нужен, чтобы уложиться в лимит?", "who": "Финансовому директору (данные), затем коммерческому директору (цель).", "ok": "Доли посчитаны, лимит назначен, цель роста остальных выручки записана в план коммерческого директора.", "proof": "Отчёт по выручке по клиентам за год; план продаж с целью по диверсификации.", "go": "Дальше, если лимит утверждён собственником и цель в плане. Если крупнейший клиент выше 35%, дополнительно: план на случай его ухода, с цифрами."}}, "План продаж считается снизу": {"w": "Рост на 40% означает конкретное число новых договоров. Каждый договор требует определённого числа встреч, каждая встреча определённого числа лидов, каждый лид стоит денег, и у менеджера есть предел сделок в месяц. Если цепочка не сходится, план не сойдётся тоже, и лучше узнать это в январе.", "e": "План РМ Групп: плюс 40% выручки. Разложение: средний контракт 2 млн в год, нужно 30 новых договоров. Конверсия из встречи 20%, значит 150 встреч. Из лида во встречу 30%, значит 500 квалифицированных лидов по 3 тысячи, это 1,5 млн бюджета маркетинга. Один менеджер закрывает 4 сделки в месяц, нужны 3 менеджера с учётом выхода на норму за 3 месяца. Теперь план это набор решений, а не цифра.", "s": ["Возьмите цель по выручке и разделите на средний контракт: число договоров.", "Через конверсии посчитайте встречи и лиды, через нормы менеджера посчитайте людей.", "Проверьте, что бюджет маркетинга и штат продаж соответствуют этим цифрам. Если нет, план или ресурсы меняются."], "g": {"q": "Сколько договоров, встреч, лидов и менеджеров стоит за планом продаж, и обеспечены ли они ресурсами?", "who": "Коммерческому директору или директору по продажам.", "ok": "Цепочка от выручки до лидов и людей посчитана с реальными конверсиями; ресурсы под неё есть в бюджете.", "proof": "Расчёт плана снизу; бюджет маркетинга и штатное расписание продаж.", "go": "Дальше, если цепочка сходится с ресурсами. Если конверсии взяты «примерно», сначала проверяем их по CRM за год."}}, "Ключевых клиентов ведёт первое лицо": {"w": "Крупный клиент, у которого есть прямой контакт с вашим первым лицом, уходит реже: его слышат, проблемы решаются быстро, конкурент не может предложить того же. Если генеральный директор появляется только при проблемах, отношения строит менеджер, и он их же уносит.", "e": "Три крупнейших клиента РМ Групп. Директор по логистике первого ни разу не видел генерального директора компании, с которой работает четыре года. Встреча раз в квартал без повестки продажи: что у них меняется, где мы не дотягиваем, что планируют. Через полгода такой клиент звонит вам первым, а не конкуренту.", "s": ["Выпишите трёх крупнейших клиентов и первое лицо у каждого (или того, кто принимает решение о подрядчике).", "Назначьте встречу или звонок с каждым в ближайший месяц: цель узнать, а не продать.", "После каждой встречи запишите три вещи: что у них меняется, что мы делаем плохо, что можем предложить."], "g": {"q": "Когда я в последний раз говорил с первым лицом каждого из трёх крупнейших клиентов, и что узнал?", "who": "Себе; затем директору по продажам, чтобы синхронизировать.", "ok": "Три встречи стоят в календаре на месяц вперёд; после каждой заметка с тремя пунктами.", "proof": "Календарь; заметки по встречам.", "go": "Дальше, если все три встречи прошли. Если клиент не находит времени на встречу с вашим первым лицом, это сигнал о состоянии отношений."}}, "Исключение становится пакетом": {"w": "Клиент просит особые условия. Если они выгодны компании, значит, есть сегмент, которому их можно предлагать всем, и это новый продукт. Если невыгодны, они невыгодны и для этого клиента. Исключения без правила накапливаются, и через год прайс существует только на бумаге.", "e": "У РМ Групп восемь клиентов с индивидуальными условиями: у кого отсрочка 60 дней, у кого бесплатная замена, у кого цена ниже прайса. Никто не помнит, почему. Разбор: отсрочка 60 дней выгодна при объёме выше 3 млн в месяц, значит это пакет «Крупный объект». Цена ниже прайса не окупается ни у кого, значит отменяем при продлении. Прайс снова работает.", "s": ["Попросите у продаж список всех действующих отклонений от прайса с причинами.", "По каждому посчитайте: выгодно ли компании с учётом объёма и отсрочки.", "Выгодные оформите как пакет с условиями входа, невыгодные поставьте в план отмены при продлении договора."], "g": {"q": "Какие исключения из прайса действуют, и какие из них выгодны компании?", "who": "Директору по продажам (список), финансам (расчёт выгоды).", "ok": "Полный список исключений с расчётом; выгодные превращены в пакеты с критериями, невыгодные с датой отмены.", "proof": "Реестр исключений; обновлённый прайс с пакетами.", "go": "Дальше, если реестр полный и по каждому есть решение. Если продажи не могут собрать список, значит исключений больше, чем известно: аудит договоров."}}, "Отток считается раньше притока": {"w": "Пока воронка растёт, отток можно не замечать. Но каждый ушедший клиент это потерянная выручка на годы и расходы на замену. Отток в деньгах за год часто больше, чем весь бюджет маркетинга, и причина у него обычно одна.", "e": "За год РМ Групп потеряла 11 клиентов на 34 млн годовой выручки. Бюджет маркетинга за тот же год 9 млн. Разбор причин по разговорам с ушедшими: семь из одиннадцати из-за срывов выходов персонала. Это не проблема продаж и не проблема маркетинга: это операционка, и она стоит компании больше, чем весь маркетинг.", "s": ["Выгрузите клиентов, которые перестали работать за год, с их годовой выручкой до ухода.", "Сложите: это цена оттока. Сравните с бюджетом привлечения.", "По каждому ушедшему узнайте настоящую причину (разговор, не CRM) и найдите главную."], "g": {"q": "Сколько выручки ушло с клиентами за год, и какая одна причина стоит за большинством уходов?", "who": "Директору по продажам (список), затем ушедшим клиентам (разговоры).", "ok": "Цифра оттока в рублях; причины минимум по половине ушедших из первых рук; главная причина названа с ответственным за устранение.", "proof": "Список ушедших с выручкой; заметки по разговорам.", "go": "Дальше, если главная причина передана ответственному с планом. Если причины известны только из CRM («цена»), разговоры не проведены, гейт не пройден."}}, "Ближе к ядру": {"w": "У каждой идеи есть расстояние от ядра бизнеса. Если клиенты те же, продавать умеете. Если люди те же, набирать умеете. Если процессы те же, управлять умеете. Каждое «нет» удваивает цену входа и вдвое снижает шанс. Три «нет» это стартап, а не направление.", "e": "Идея для РМ Групп: клининг для тех же складов. Клиенты те же: да, продажи через тех же ЛПР. Люди: частично, другой профиль и график. Процессы: нет, другое оборудование, химия, контроль качества. Одно «да» из трёх: цена входа высокая. Сравним: временный персонал для производств в новом регионе. Клиенты другие, люди те же, процессы те же. Два из трёх, дешевле и вероятнее.", "s": ["Возьмите идею, которую обсуждают как следующее направление.", "По каждой оси поставьте да / частично / нет и объясните одной фразой.", "Сравните с альтернативой, у которой больше «да». Сформулируйте, почему выбираете ту или другую."], "g": {"q": "Насколько идея близка к ядру по клиентам, людям и процессам, и есть ли идея ближе?", "who": "Себе, затем собственнику при обсуждении направления.", "ok": "Оценка по трём осям с обоснованием и сравнение с одной альтернативой.", "proof": "Одностраничная оценка; данные о текущих клиентах и процессах.", "go": "Дальше (считаем цену входа), если минимум два «да». Если одно или ноль, обсуждаем как отдельный бизнес с отдельными деньгами, а не как рост."}}, "Критерий остановки записан заранее": {"w": "Каждое новое направление начинается с энтузиазма, и через год всегда «вот-вот выстрелит». Единственная защита от этого: до старта записать, что считаем успехом и к какой дате, и что делаем, если его нет. Тогда закрытие это выполнение договорённости, а не поражение.", "e": "Новое направление РМ Групп второй год в минусе, руководитель уверяет, что крупный контракт на подходе. Собственник колеблется. Правило, записанное при запуске, спасло бы: «К концу первого года выручка 20 млн и маржа выше 5%, иначе закрываем». Сейчас его нет, и решение принимается на эмоциях. Записать критерий можно и сегодня: «К 31 марта выручка 8 млн в квартал, иначе закрываем».", "s": ["Выпишите все направления, кроме основного, включая пилоты.", "По каждому запишите: какая выручка и маржа к какой дате означают успех; что делаем, если нет.", "Согласуйте критерии с руководителями направлений и собственником, чтобы потом не было спора."], "g": {"q": "При какой цифре к какой дате направление закрывается, и кто это подтвердил?", "who": "Руководителю направления, затем собственнику.", "ok": "По каждому направлению записаны число, дата и действие; руководитель и собственник подтвердили.", "proof": "Документ с критериями и подписями или подтверждениями в переписке.", "go": "Дальше, если критерии подтверждены всеми. Если руководитель направления отказывается назвать цифру, это уже ответ на вопрос о перспективах."}}, "Что именно покупаем": {"w": "Цена сделки обсуждается первой, а надо бы последней. Сначала: какие клиенты перейдут (и не уйдут ли за старым владельцем), какие люди останутся (и на каких условиях), какие процессы работают без основателя. То, что уйдёт, из цены вычитается.", "e": "Конкурент РМ Групп продаётся: 40 клиентов, 300 человек в базе, два координатора и основатель, который ведёт всех ключевых клиентов лично. Что покупаем: 40 клиентов, из которых 15 крупных держатся на основателе. Если он уходит, уходят и они. База персонала частично пересекается с вашей. Реально покупаем 25 небольших клиентов и двух координаторов. Цена должна считаться от этого.", "s": ["Возьмите сделку или партнёрство, которое обсуждается, даже гипотетически.", "Разложите: клиенты, люди, процессы, бренд, активы. По каждому: что переходит и что удерживается через год.", "Оцените в деньгах только то, что удерживается, и сравните с запрашиваемой ценой."], "g": {"q": "Что конкретно переходит к нам в сделке, и что из этого останется через год?", "who": "Себе с финансами, затем продавцу (проверочные вопросы).", "ok": "Разложение по четырём составляющим с оценкой удержания и цена, посчитанная от удерживаемого.", "proof": "Список клиентов и людей с оценкой риска ухода; расчёт цены.", "go": "Дальше, если удерживаемое оправдывает цену. Если больше половины ценности сидит в основателе, сделка без его удержания на 2-3 года не имеет смысла."}}, "Деньги на одно": {"w": "Каждое направление требует внимания первого лица, лучших людей и денег. Разделённые на три, они не хватают ни одному. Правило портфеля: одно новое направление за раз, до достижения или провала критерия, потом следующее. Отвергнутые идеи не умирают, они ждут в списке с датой пересмотра.", "e": "У РМ Групп одновременно: пилот в новом регионе, тест клининга, запуск PM-консалтинга. На каждый по 15% внимания генерального директора и по половине маркетолога. Ни одно не выходит на критерий. Решение: регион первым, у него два «да» из трёх по близости к ядру; клининг и консалтинг в лист ожидания с датой пересмотра через два квартала.", "s": ["Выпишите все направления и пилоты, которые сейчас идут параллельно.", "Оцените каждое по близости к ядру и по ожидаемой окупаемости. Выберите одно.", "Остальные остановите письменно с датой пересмотра и сообщите командам, почему."], "g": {"q": "Какое одно новое направление получает ресурсы сейчас, и почему не остальные?", "who": "Себе, затем собственнику и руководителям остановленных направлений.", "ok": "Выбрано одно с обоснованием; остальные остановлены письменно с датой пересмотра.", "proof": "Решение в документе; лист ожидания с датами.", "go": "Дальше, если собственник согласился с одним. Если он настаивает на всех трёх, фиксируем письменно, что ресурсов хватает на одно, и что произойдёт с остальными."}}, "Стратегия группы на одной странице": {"w": "Стратегия в голове собственника и стратегия в голове генерального директора часто разные. Пока она не записана на одной странице, каждый директор действует по своей версии. Одна страница выявляет расхождения раньше, чем они стоят денег.", "e": "Одна страница РМ Групп: «Мы выигрываем на срочных заявках складов и производств в трёх регионах. Отказываемся от розницы и разовых заказов ниже 500 тысяч. Вкладываем в базу персонала и скорость замены. Через год: 30% выручки вне первого региона, доля крупнейшего клиента ниже 25%, маржа выше 12%». Собственник читает и говорит: «А розницу я хотел развивать». Расхождение найдено за 10 минут, а не за год.", "s": ["Напишите четыре абзаца: где выигрываем, от чего отказываемся, куда вкладываем, что случится через год (с цифрами).", "Дайте прочитать собственнику и каждому директору отдельно, попросите отметить, с чем не согласны.", "Соберите расхождения и обсудите их на одной встрече. Итог: одна страница, с которой согласны все."], "g": {"q": "Совпадает ли моя одна страница стратегии с тем, что думают собственник и директора?", "who": "Собственнику и каждому директору по отдельности.", "ok": "Страница написана, прочитана всеми, расхождения собраны и разобраны на встрече, итоговая версия подтверждена.", "proof": "Документ на одну страницу; заметки с расхождениями; протокол встречи.", "go": "Дальше, если итоговую версию подтвердил собственник. Если расхождений с собственником больше двух и они не разобраны, работать по стратегии рано."}}, "Нанимать сильнее себя": {"w": "Соблазн нанять удобного: он не спорит, всё согласовывает, вы контролируете. Но тогда вы продолжаете решать за его область, а зарплату платите двоим. Сильный директор приносит решения, которые вам не пришли бы в голову, и спорит с вами аргументами. Это неудобно и это единственный способ расти.", "e": "РМ Групп ищет директора по операциям. Требования в вакансии: «опыт в аутсорсинге, знание 1С, ответственность». Требования на уровне топа: «выстроил операционную систему на 500+ человек в поле, снизил невыходы в разы, может показать метрики до и после, объяснит, что бы сделал у нас за первые 90 дней». Второй кандидат будет спорить с вами, и это правильно.", "s": ["Напишите, какие три результата должен принести этот руководитель за год.", "По каждому результату придумайте вопрос о прошлом опыте: где делал похожее, какие цифры, что не получилось.", "Запишите признак, что кандидат сильнее вас: он называет решения, которые вы не рассматривали."], "g": {"q": "В чём этот руководитель должен быть сильнее меня, и как я это проверю на собеседовании?", "who": "Себе при подготовке; кандидату на встрече.", "ok": "Три результата за год, три вопроса с критериями сильного ответа; после встречи отмечено, назвал ли кандидат то, чего вы не знали.", "proof": "Профиль роли с результатами; заметки по собеседованию.", "go": "Дальше (оффер), если кандидат хотя бы раз удивил вас решением или знанием. Если он только соглашался, это не тот уровень, каким бы приятным ни был."}}, "Полномочия вместе с ответственностью": {"w": "Директор отвечает за маржу, но не может менять цены и увольнять. Директор по операциям отвечает за невыходы, но не может нанимать координаторов без согласования. В обоих случаях ответственность формальная: человек не управляет тем, за что отвечает, и вы получите отговорки вместо результата.", "e": "Директор по продажам РМ Групп отвечает за выручку. Проверка: может ли он менять состав команды (нет, найм через вас), давать условия клиентам (только до 5% скидки), тратить на лиды (бюджет у маркетинга). Он отвечает за выручку, не управляя ни людьми, ни ценой, ни лидами. Либо полномочия, либо ответственность у вас, а он помощник.", "s": ["По каждому директору выпишите: за что отвечает (метрика) и какие решения по этой метрике принимает сам.", "Найдите разрывы: где отвечает, но не решает. Это его отговорки на следующей планёрке.", "Закройте разрыв: дайте полномочия с порогами или честно заберите ответственность."], "g": {"q": "Управляет ли каждый директор всем, за что отвечает?", "who": "Себе, затем каждому директору.", "ok": "По каждому директору таблица ответственность / полномочия без разрывов; разрывы закрыты письменно.", "proof": "Таблица; обновлённые границы полномочий.", "go": "Дальше, если разрывов нет. Если полномочия дать не готовы, это значит, что не доверяете человеку, и вопрос уже не про полномочия."}}, "Замена себе": {"w": "Незаменимость кажется защитой, а работает как потолок: собственник не отпустит вас на группу компаний, пока компания без вас встанет. Преемник это не угроза, а условие вашего следующего шага. Если такого человека нет, найм преемника это ваша задача, а не HR.", "e": "Генеральный директор РМ Групп хочет расти до управления группой. Собственник: «А кто останется?» Ответа нет. Правильно за два года до этого: выбран директор по операциям как кандидат, ему постепенно отдаются финансы и работа с ключевыми клиентами, раз в квартал он ведёт совет вместо вас. Через два года собственнику есть кого оставить, и вы свободны для следующей ступени.", "s": ["Выпишите трёх людей в компании, которые теоретически могли бы занять ваше место.", "По каждому: чего не хватает (навыки, опыт, доверие собственника) и что можно дать за год.", "Выберите одного и запишите три вещи, которые передадите ему в ближайшие полгода."], "g": {"q": "Кто мой преемник, и что я передам ему в ближайшие полгода?", "who": "Себе; затем собственнику, чтобы он видел план.", "ok": "Назван человек, три конкретных зоны для передачи с датами, собственник в курсе.", "proof": "План развития преемника; заметка о разговоре с собственником.", "go": "Дальше, если человек назван и первая зона передана. Если преемника нет ни среди трёх, найм преемника ставится в план на этот год."}}, "Разные директора, одна метрика": {"w": "Продажи хотят объём любой ценой, операции хотят только удобные объекты. Каждый выполняет свою метрику и ломает чужую. Разговоры о сотрудничестве не помогают: люди делают то, за что отвечают. Одна общая метрика (например, маржа по новым объектам) заставляет их договариваться.", "e": "В РМ Групп продажи берут объекты в 200 км от базы, операции не могут их укомплектовать, обе стороны обвиняют друг друга. Метрика продаж: выручка. Метрика операций: невыходы. Общая метрика для обоих: маржа по новым объектам за квартал. Теперь продажи спрашивают операции до подписания, а операции помогают продажам отбирать объекты. Конфликт не исчез, но стал рабочим.", "s": ["Выпишите пары директоров, между которыми регулярно возникает трение.", "По каждой паре найдите, где их метрики противоречат друг другу.", "Придумайте одну метрику, которая выигрывает только при их сотрудничестве, и закрепите её за обоими."], "g": {"q": "У какой пары директоров цели противоречат друг другу, и какая одна метрика заставит их сотрудничать?", "who": "Себе, затем обоим директорам вместе.", "ok": "Названа пара, найдено противоречие метрик, назначена общая метрика, оба подтвердили.", "proof": "Обновлённые цели директоров с общей строкой.", "go": "Дальше, если оба согласились с общей метрикой. Если один считает, что она несправедлива, разбираем на встрече втроём, а не по отдельности."}}, "Увольнение сильного": {"w": "Собственник видит цифры и говорит: остальное лирика. Но текучка это тоже цифры: стоимость найма, месяцы выхода на норму, срывы во время замены, уход клиентов вместе с координаторами. Когда это посчитано, разговор о стиле управления становится разговором о деньгах.", "e": "Директор по операциям РМ Групп снизил невыходы вдвое. За год от него ушли четыре координатора и два руководителя. Цена: найм и обучение каждого координатора 150 тысяч плюс два месяца до нормы, за которые на его объектах невыходы возвращаются. Ушёл клиент, который работал с одним из ушедших. Итого около 3 млн за год. Половина его результата съедена его же стилем, и собственник теперь это видит.", "s": ["Возьмите руководителя, о котором есть жалобы, но есть и результат.", "Выпишите всех, кто ушёл от него за год, и посчитайте по каждому: найм, обучение, простой, потерянные клиенты.", "Сравните сумму с его вкладом. Подготовьте разговор с ним: факты, что должно измениться, срок."], "g": {"q": "Сколько стоит компании текучка у этого руководителя, и перекрывает ли её его результат?", "who": "HR (данные по уходам), финансам (цена найма), затем собственнику.", "ok": "Цифра текучки в рублях за год против вклада руководителя; решение: план на 60 дней или расставание.", "proof": "Список ушедших с расчётом; протокол разговора с руководителем.", "go": "Дальше, если разговор состоялся и план на 60 дней записан. Если через 60 дней уходы продолжаются, решение принимаем, несмотря на цифры результата."}}, "Правила игры с собственником": {"w": "Собственник вмешивается не из вредности: это его деньги, и у него нет другого способа влиять, кроме прямых указаний. Если дать ему формат, где он влияет на всё, но через правила и через вас, вмешательства уменьшаются. Формат должны предложить вы.", "e": "Собственник РМ Групп ставит задачи директорам напрямую и меняет цены без ведома генерального. Предложение: «Ваши решения: сделки свыше 20 млн, новые направления, дивиденды, найм и увольнение директоров. Мои: всё операционное, цены в пределах прайса, найм ниже директоров, бюджет в пределах утверждённого. Совместные: бюджет на год, стратегия, ключевые клиенты. Директора получают задачи от меня; ваши идеи обсуждаем на еженедельной встрече». Собственник, скорее всего, поправит, но правила появятся.", "s": ["Напишите три списка с конкретными порогами: суммы, должности, типы решений.", "Добавьте формат: как часто встречаетесь, что он видит в отчётности, как попадают его идеи.", "Отправьте как предложение к обсуждению, не как ультиматум. На встрече зафиксируйте итог письменно."], "g": {"q": "Какие решения принимает собственник, какие я, какие вместе, и согласен ли он с этим?", "who": "Собственнику.", "ok": "Три списка с порогами обсуждены, итоговая версия зафиксирована письменно, обе стороны подтвердили.", "proof": "Документ с правилами; подтверждение в переписке.", "go": "Дальше, если правила подписаны и месяц соблюдаются. Если собственник нарушил их дважды, разговор повторяется с примерами и ценой нарушений."}}, "Плохие новости до отчёта": {"w": "Квартал провален, кассовый разрыв, ушёл клиент, проверка. Соблазн подождать, пока картина прояснится или пока не спросят. Но доверие собственника строится ровно на этом: он узнаёт о плохом от вас раньше, чем от кого-либо, и вместе с планом. Тогда провал это рабочая ситуация, а не повод усомниться в вас.", "e": "Ключевой клиент сообщил об уходе через два месяца. Вариант первый: два месяца искать замену и сообщить, когда найдёте (или не найдёте). Вариант второй: в тот же день собственнику: «Клиент уходит, минус 12 млн в год с сентября. Причина такая-то. Делаю: разговор с их первым лицом, три кандидата на замену, кассовый сценарий без него. Прошу: неделю на план и вашу помощь с двумя контактами». Второй вариант оставляет вас управляющим ситуацией.", "s": ["Пробегитесь по всем зонам: касса, клиенты, люди, проверки, проекты. Что идёт не так?", "Выберите самое серьёзное, о чём собственник ещё не знает. Напишите четыре фразы: что, цена, что сделано, что нужно.", "Отправьте или скажите сегодня. Полная картина не нужна, нужна скорость."], "g": {"q": "Есть ли сегодня факт, о котором собственнику лучше узнать от меня?", "who": "Себе, затем собственнику.", "ok": "Факт, цена, действия, запрос в одном сообщении, отправлено в день обнаружения.", "proof": "Отправленное сообщение с датой; реакция собственника.", "go": "Дальше, если ушло сегодня. Если вы решили «подождать до ясности», поставьте себе 24 часа, не больше."}}, "Пилот против убыточной идеи": {"w": "Прямой отказ собственнику работает один раз, потом он перестаёт вам доверять или вас слушать. Молчаливое выполнение убыточного решения стоит компании денег и вам репутации, когда оно провалится. Пилот решает оба: собственник получает свою идею, компания ограниченный риск, вы данные для следующего разговора.", "e": "Собственник РМ Групп хочет открыть офис в новом регионе с полной командой: 8 млн за год. Ваш расчёт: спроса не хватит. Пилот: один менеджер по продажам удалённо плюс реклама на регион, 600 тысяч за три месяца, критерий успеха 5 подписанных договоров. Если успех, открываем офис с цифрами в руках. Если нет, собственник сам видит, что рынка нет, и вы ничего не запрещали.", "s": ["Возьмите идею собственника, которую считаете рискованной.", "Придумайте минимальную версию: один город, один клиент, один канал, три месяца, бюджет до 5% годовой прибыли.", "Запишите критерий успеха числом и что будет после: масштабируем или закрываем. Предложите собственнику."], "g": {"q": "Какая минимальная версия идеи собственника даёт ответ за квартал при ограниченной цене ошибки?", "who": "Собственнику.", "ok": "Пилот с бюджетом, сроком, числовым критерием и решением по итогу принят собственником.", "proof": "Описание пилота; подтверждение собственника.", "go": "Дальше, если пилот принят. Если собственник настаивает на полном запуске, фиксируем письменно риски и точку остановки, и запускаем: это его деньги."}}, "Отчёт, который снимает контроль": {"w": "Ежедневные звонки собственника это не недоверие, а голод по информации. Если он раз в неделю получает понятную картину: остаток на счетах, выручка к плану, три риска, три решения, что от него нужно, то ему незачем звонить. Отчёт должен быть коротким, регулярным и честным, включая плохое.", "e": "Каждый понедельник собственник РМ Групп получает: «Касса: 14 млн, покрытие 3 недели. Выручка месяца: 82% плана, отставание из-за задержки запуска объекта X. Риски: дебиторка клиента Y 6 млн просрочена 20 дней; проверка на объекте Z. Решения недели: подписали регион, отклонили скидку W. От вас: звонок первому лицу Y». Полстраницы, три минуты, и звонков в середине недели становится вдвое меньше.", "s": ["Напишите структуру из пяти блоков: касса, выручка к плану, риски, решения недели, что нужно от собственника.", "Заполните её за прошлую неделю и посмотрите на объём: должно быть не больше половины страницы.", "Отправьте собственнику первый выпуск и спросите, чего не хватает и что лишнее."], "g": {"q": "Что собственник хочет видеть каждую неделю, чтобы не звонить каждый день?", "who": "Собственнику.", "ok": "Формат из пяти блоков согласован, первый выпуск отправлен, собственник сказал, что менять.", "proof": "Первый отчёт; ответ собственника.", "go": "Дальше, если отчёт выходит четыре недели подряд. Если собственник перестал их читать, формат не тот: спросить, что он на самом деле смотрит."}}, "Обещать меньше, делать всё": {"w": "На уровне первого лица вас оценивают не по идеям, а по предсказуемости: сказал, сделал, в срок. Каждое обещание, которое не выполнено и не переобещано заранее, снижает доверие, и в следующий раз собственник будет проверять. Правило: обещать только то, что гарантируете, о срыве сообщать до дедлайна.", "e": "За квартал генеральный директор РМ Групп обещал собственнику: выйти в регион, снизить дебиторку до 15 млн, нанять директора по операциям, закрыть убыточное направление. Выполнено: регион да, дебиторка 22 млн, директор в процессе, направление отложено. Один из четырёх. Следующий разговор о бюджете начнётся с недоверия. Лучше было пообещать два и сделать оба.", "s": ["Найдите всё, что вы обещали собственнику за квартал: письма, встречи, отчёты.", "Напротив каждого: выполнено / нет / частично, и было ли предупреждение до срока.", "На следующий квартал оставьте вдвое меньше обещаний и отчитайтесь по прошлым сами, до того как спросят."], "g": {"q": "Какая доля обещанного собственнику выполнена полностью и в срок?", "who": "Себе; затем собственнику в виде отчёта по обещаниям.", "ok": "Список обещаний со статусами; доля выполненного; по невыполненным причина и был ли заранее предупреждён собственник.", "proof": "Письма и протоколы за квартал; отчёт собственнику.", "go": "Дальше, если выполнено 80% и больше или все срывы были переобещаны заранее. Если меньше половины, на следующий квартал число обещаний режется вдвое."}}, "Три риска, которые закроют компанию": {"w": "Рисков сотни, но убить компанию могут три-пять: уход ключевого клиента, кассовый разрыв, проверка с претензией на прибыль года, уход ключевого руководителя, репутационный удар. Когда они названы и оценены, вы перестаёте бояться всего подряд и начинаете готовиться к главному.", "e": "Три риска РМ Групп: клиент с 38% выручки уходит (вероятность средняя, цена 40 млн в год, план: лимит доли и три замещающих клиента к марту); проверка оформления персонала на объектах (вероятность высокая, цена до 30 млн, план: аудит юрлиц до декабря); кассовый разрыв при задержке двух крупных оплат (вероятность высокая, цена остановка объектов, план: кредитная линия 10 млн и лимит дебиторки на клиента). Три строки, и собственник впервые видит карту.", "s": ["Выпишите десять событий, которые могут навредить компании. Не стесняйтесь очевидных.", "По каждому оцените вероятность (низкая, средняя, высокая) и цену в рублях или в последствиях. Выберите три самых опасных.", "По каждому из трёх напишите план снижения и ответственного. Покажите собственнику."], "g": {"q": "Какие три события могут закрыть компанию за полгода, и что мы делаем по каждому?", "who": "Себе с директорами, затем собственнику.", "ok": "Три риска с вероятностью, ценой, планом и ответственным на одной странице; собственник видел.", "proof": "Карта рисков; подтверждение собственника.", "go": "Дальше, если по каждому риску есть первое действие с датой в этом квартале. Если план «будем следить», плана нет."}}, "Юрлица как переборки": {"w": "Группа юрлиц часто создаётся для удобства, а не для защиты. Но если персонал оформлен через одно, договоры подписаны другим, а деньги ходят через третье, любая проверка тянет за собой всех. Переборки работают только когда у каждого юрлица свои договоры, свои люди и свои деньги.", "e": "В РМ Групп три юрлица. Проверка одного выявила, что персонал на его объектах оформлен через другое, а платит третье. Претензия автоматически распространяется на всех. Правильная конструкция: каждое юрлицо само заключает договоры с клиентами и персоналом по своим объектам, движение денег между ними оформлено договорами и обосновано. Тогда проблема на одном объекте остаётся проблемой одного юрлица.", "s": ["Нарисуйте схему: юрлица, у каждого договоры с клиентами, договоры с персоналом, счета, руководитель.", "Найдите места, где одно юрлицо обслуживает объекты другого или деньги ходят без оформления.", "Обсудите с юристом и финансами, что из этого закрыть в первую очередь и сколько это стоит."], "g": {"q": "Пострадают ли другие юрлица группы, если к одному придёт претензия?", "who": "Юристу и финансовому директору.", "ok": "Схема группы с потоками договоров, людей и денег; названы уязвимые связи и план их закрытия.", "proof": "Схема; заключение юриста; план с датами.", "go": "Дальше, если уязвимых связей нет или они в плане на квартал. Если юрист говорит «всё нормально» без схемы, это не ответ: просим схему."}}, "Первые два часа кризиса": {"w": "Репутационный удар, авария на объекте, проверка, утечка данных. В момент кризиса думать некогда, и действуют по инерции: удаляют, оправдываются, молчат. План, написанный в спокойное время, экономит эти два часа и репутацию. Он короткий: проверить факты, назначить один голос, предупредить клиентов и собственника, подготовить продажам ответ.", "e": "Кризис РМ Групп: пост бывшего сотрудника о невыплатах расходится по сети. План на два часа: финансы за 30 минут проверяют, были ли задержки (были, на одном объекте); генеральный директор согласовывает один ответ от компании; продажи получают текст для вопросов клиентов; собственник узнаёт от вас, а не из ленты; юрист оценивает, нужна ли реакция автору. Без плана эти два часа уходят на споры в комментариях.", "s": ["Назовите три кризиса, которые наиболее вероятны для вашей компании.", "По каждому напишите пять строк: кто проверяет факты, кто говорит публично, кто предупреждает клиентов, кто собственника, что дают продажам.", "Раздайте участникам и раз в полгода проверяйте, что телефоны и роли актуальны."], "g": {"q": "Кто что делает в первые два часа каждого из трёх вероятных кризисов?", "who": "Себе с директорами по продажам, операциям и юристом.", "ok": "Три плана по пять строк с фамилиями; участники знают свои роли.", "proof": "Документ с планами; подтверждения участников.", "go": "Дальше, если планы розданы. Если ключевая роль (кто говорит публично) не назначена, кризис будет говорить сам за себя."}}, "Договоры, которые вас не защищают": {"w": "Договоры подписывают продажи, читают юристы, а последствия несёт компания. Типовой договор часто содержит штрафы за невыход, которые превышают маржу объекта, односторонний выход клиента за три дня, ответственность за действия персонала без ограничений. Первое лицо знает, что подписывает компания.", "e": "Типовой договор РМ Групп с крупным клиентом: штраф за каждого невышедшего сотрудника 5 тысяч, при марже на человека 1,5 тысячи в смену. Расторжение клиентом за 5 дней, вами за 30. Ответственность за ущерб от персонала без лимита. Один срыв смены на 20 человек съедает маржу за две недели. Пересмотр: лимит штрафов маржой объекта, симметричные сроки расторжения, лимит ответственности суммой контракта за месяц.", "s": ["Возьмите типовой договор и договор с крупнейшим клиентом.", "Выпишите: штрафы и их размер против вашей маржи; сроки расторжения для обеих сторон; лимит ответственности.", "Отметьте, что несимметрично или превышает маржу, и обсудите с юристом, что менять при продлении."], "g": {"q": "Что мы платим клиенту при срыве, за сколько дней он может уйти, и есть ли лимит нашей ответственности?", "who": "Юристу и директору по продажам.", "ok": "По типовому и по крупнейшему договору три цифры выписаны и сравнены с маржой; список изменений при продлении.", "proof": "Договоры; таблица условий; предложения по изменениям.", "go": "Дальше, если изменения согласованы к ближайшему продлению. Если штраф за срыв больше маржи объекта и изменить нельзя, объект пересчитывается: возможно, он убыточен с учётом риска."}}, "Кассовый стресс-тест": {"w": "Кассовый разрыв редко приходит от одного события. Обычно совпадают два: задержка оплаты и рост ФОТ, или уход клиента и штраф. Стресс-тест это простое упражнение: берёте два плохих события, накладываете на кассовый прогноз и смотрите, где дно. Потом решаете, чем его закрыть заранее: линия, резерв, факторинг.", "e": "РМ Групп: два крупнейших клиента платят вместе 12 млн в месяц. Если оба задержат на 30 дней, а ФОТ 18 млн нужно платить 10-го числа, дыра 9 млн. Резерва нет, кредитной линии нет, факторинг не оформлен. Ответ на вопрос «откуда» ищется за неделю до выплаты. Стресс-тест сегодня превращает это в план: линия на 10 млн, оформленная в спокойное время, стоит дешевле, чем в панике.", "s": ["Возьмите кассовый прогноз на 8 недель.", "Сдвиньте поступления от двух крупнейших клиентов на 30 дней и посмотрите на минимальный остаток.", "Если он ниже одной недели ФОТ, запишите, чем закрываете: линия, резерв, факторинг, отсрочка своим поставщикам. Начните оформлять сегодня."], "g": {"q": "Хватит ли денег на ФОТ, если два крупнейших клиента задержат оплату на месяц, и откуда возьмём недостающее?", "who": "Финансовому директору.", "ok": "Смоделированный сценарий с минимальным остатком; источник покрытия назван и его оформление начато.", "proof": "Кассовый прогноз со сценарием; заявка в банк или договор факторинга.", "go": "Дальше, если источник покрытия оформлен или в процессе. Если ответ «попросим клиентов заплатить раньше», это не источник, а надежда."}}, "Порог решения": {"w": "Пока порога нет, к вам приходит всё: и договор на 20 млн, и покупка принтера. Мозг тратит одинаковую энергию на оба. Порог (например, 300 тысяч рублей и обратимость) отсекает 80% решений. Решения дешевле порога принимают руководители без вас, и вы отвечаете только за то, где ошибка действительно дорогая.", "e": "Журнал генерального директора РМ Групп за две недели: 47 решений. Дороже 300 тысяч или необратимых: 6. Остальные 41 могли принять директора и координаторы. После введения порога и границ полномочий через месяц приходит 12 решений, из них 5 по делу. Освободилось около 8 часов в неделю на клиентов и стратегию.", "s": ["Заведите заметку и две недели записывайте каждое решение: суть, цена ошибки в рублях, обратимо ли.", "Посмотрите распределение: сколько решений дороже 300 тысяч или необратимых.", "Назначьте порог и разошлите: всё ниже порога и обратимое решается без меня."], "g": {"q": "Сколько из моих решений за две недели действительно требовали меня, и какой порог отсечёт остальные?", "who": "Себе, затем руководителям.", "ok": "Журнал за две недели с ценой каждого решения; порог назначен и разослан.", "proof": "Журнал; сообщение с порогом.", "go": "Дальше, если через месяц число решений у вас упало минимум вдвое. Если люди продолжают носить мелкое, спросите, чего боятся: скорее всего, наказания за ошибку."}}, "Календарь как стратегия": {"w": "Куда уходит время первого лица, туда идёт компания. Норма для уровня топа: треть на людей (свои директора, найм, развитие), треть на внешнее (клиенты, рынок, стратегия), треть свободна для неожиданного и размышлений. Операционка в календаре генерального директора это чужая работа, которую вы делаете.", "e": "Неделя генерального директора РМ Групп: 22 часа планёрок и согласований, 6 часов на клиентов, 2 часа на найм директора, 0 часов на стратегию, 15 часов работы вечерами. Пересборка: планёрки заменены еженедельной сводкой и одной встречей директоров; освобождённые 15 часов уходят на трёх ключевых клиентов, собеседования и два часа в неделю без встреч на размышления.", "s": ["Откройте календарь прошлой недели и пометьте каждый час: люди, внешнее, операционка, свободно.", "Посчитайте доли. Сравните с нормой: треть, треть, треть, ноль операционки.", "Выберите три повторяющиеся встречи, которые уберёте или отдадите, и поставьте вместо них защищённые блоки."], "g": {"q": "На что ушло моё время за неделю, и что из этого не моя работа?", "who": "Себе.", "ok": "Разбивка по четырём категориям; три встречи убраны; защищённые блоки стоят на месяц вперёд.", "proof": "Календарь прошлой и следующей недели.", "go": "Дальше, если операционка заняла меньше 20% и блоки стоят. Если блоки исчезли через неделю, их никто не защищает, кроме вас."}}, "Заместитель с правом ошибаться": {"w": "Люди не берут решения на себя не потому, что не умеют, а потому, что первая же ошибка была разобрана как провал. Заместитель должен знать: в пределах такой-то суммы и таких-то тем он решает сам, ошибки в этих пределах это цена его роста, разбор будет обучающим, а не карательным.", "e": "Заместитель генерального директора РМ Групп приносит на согласование даже график отпусков координаторов. Разговор: «В пределах 500 тысяч и любых кадровых решений ниже директора ты решаешь сам. Если ошибёшься на эти деньги, это бюджет твоего обучения, и я его заложил. Разбираем ошибки раз в месяц вместе, без последствий, если они в пределах». Через два месяца он приносит вам одно решение в неделю вместо десяти.", "s": ["Напишите заместителю пределы: сумма, темы, кадровые решения, где он решает сам.", "Добавьте фразу про ошибки: в этих пределах они допустимы и разбираются как учебные.", "Скажите это вслух и держите слово при первой ошибке: это момент, когда полномочие становится настоящим."], "g": {"q": "В каких пределах мой заместитель может ошибиться без последствий, и знает ли он об этом?", "who": "Заместителю.", "ok": "Пределы названы с цифрами и темами, фраза про право на ошибку произнесена, заместитель подтвердил.", "proof": "Сообщение или документ; первая ошибка в пределах разобрана без последствий.", "go": "Дальше, если первая ошибка прошла по договорённости. Если вы её разобрали как провал, полномочия отозваны, и придётся начинать заново."}}, "Энергия как ресурс компании": {"w": "Решения после 12-часового дня хуже решений после сна. Конфликт, который вы тащите неделями, стоит больше, чем неделя работы. Энергия расходуется не на объём работы, а на конкретные вещи: бессмысленные встречи, нерешённые конфликты, задачи не своего уровня. Их можно назвать и убрать.", "e": "Генеральный директор РМ Групп замечает: после понедельничной планёрки с собственником на два часа нет сил до среды; конфликт двух директоров тянется месяц; каждый вечер разбор мелких согласований. Три вещи. Планёрка сокращается до 40 минут с повесткой; конфликт закрывается одной встречей втроём с общей метрикой; согласования уходят за порог. Энергии на клиентов и стратегию становится заметно больше.", "s": ["В конце каждого дня недели запишите: что сегодня отняло больше всего сил, и стоило ли оно того.", "В пятницу выберите три главных пожирателя энергии.", "Уберите один на следующей неделе: делегируйте, сократите, закройте вопрос. Проверьте через неделю."], "g": {"q": "Что в моей неделе отнимает больше всего энергии несоразмерно результату?", "who": "Себе.", "ok": "Три пожирателя названы; один убран; через неделю есть замер разницы.", "proof": "Ежедневные заметки за неделю; действие по одному пункту.", "go": "Дальше, если один убран и через неделю стало легче. Если все три «нельзя убрать», это самообман: хотя бы один можно сократить вдвое."}}, "Год спустя": {"w": "Операционка съедает горизонт: вы решаете сегодняшнее, и год приходит сам, не тот, что нужен. Раз в месяц два часа на вопрос «что должно случиться через год и что для этого нужно начать сейчас» держат горизонт. Многие решения имеют срок созревания: найм директора это полгода, новый регион это год, преемник это два.", "e": "Год спустя для РМ Групп: 30% выручки вне первого региона, доля крупнейшего клиента ниже 25%, директор по операциям на месте, вы отдали операционку и ведёте группу. Что нужно начать в этом месяце: найм директора (полгода до выхода на норму), пилот региона (квартал до ответа), разговор с собственником о правилах (без него всё остальное не сработает). Три решения этого месяца определяют год.", "s": ["Напишите пять фраз о компании через год: цифры, люди, структура, ваша роль.", "По каждой фразе назовите, что должно начаться в ближайший месяц, чтобы она сбылась.", "Выберите три действия и поставьте их в календарь этого месяца. Повторите упражнение через месяц."], "g": {"q": "Что должно случиться в компании через год, и что для этого я начинаю в этом месяце?", "who": "Себе; затем собственнику как часть стратегии.", "ok": "Страница с пятью фразами и тремя действиями на месяц; действия в календаре.", "proof": "Документ; календарь.", "go": "Дальше, если три действия начаты в течение месяца. Если через месяц страница не открывалась, горизонт съеден операционкой: возвращаемся к порогу решений и календарю."}}};
var BOSS2 = [{"c": "fin", "t": "Кассовый разрыв через три недели", "s": "Финансовый директор показывает: через три недели не хватит 4 млн на ФОТ персонала на объектах. Два крупных клиента задерживают оплату, банк тянет с кредитной линией. Уйти на задержку зарплаты нельзя: люди разбегутся, и объекты встанут. У вас сутки на план.", "ref": ["Сначала цифры: точный график поступлений и выплат по дням на 6 недель, а не общая сумма.", "Дебиторка: личные звонки первым лицам клиентов-должников, частичная оплата сейчас лучше полной потом.", "Факторинг или короткий заём под контракты как страховка, даже дорогой: цена невыплаты выше.", "Приоритет выплат: персонал на объектах первый, всё остальное сдвигается.", "Собственнику доложить сегодня с планом, а не в день выплат.", "После кризиса: правило по отсрочкам и лимит доли одного клиента в дебиторке."]}, {"c": "ops", "t": "Компания не работает без вас", "s": "Вы взяли две недели отпуска. На четвёртый день телефон разрывается: координаторы не знают, можно ли выводить людей клиенту с просроченной оплатой; бухгалтерия ждёт вашей подписи; директор по продажам дал скидку без согласования; два объекта сорвали смену. Вы возвращаетесь на три дня раньше. Что меняете, чтобы это не повторилось?", "ref": ["Признать: проблема не в людях, а в отсутствии границ полномочий и правил.", "Выписать все решения, которые пришли к вам за эти дни, и по каждому назначить владельца и правило.", "Три-пять регламентов на самые частые ситуации: просрочка клиента, скидка, срыв смены.", "Метрики процесса еженедельно вместо ежедневного ручного контроля.", "Заместитель с реальными полномочиями и правом ошибаться в заданных пределах.", "Следующий отпуск через два месяца как тест системы."]}, {"c": "sales", "t": "Ключевой клиент уходит к конкуренту", "s": "Клиент, дающий 40% выручки, сообщает, что через два месяца переходит к конкуренту, который дешевле на 15%. Директор по продажам предлагает дать скидку 20%. Финансы говорят, что при такой скидке контракт уходит в ноль. Ваше решение и план на два месяца?", "ref": ["Сначала разговор с первым лицом клиента: цена почти никогда не единственная причина.", "Считать, что реально стоит потеря: не только выручка, но и загрузка людей, которые останутся без объектов.", "Скидка в ноль не спасает: контракт без маржи хуже, чем поиск замены.", "Предложить пакет с ценностью вместо цены: гарантии, сервис, условия оплаты.", "Параллельно запустить план замещения: три-пять клиентов на ту же загрузку.", "Итог для компании: лимит доли одного клиента и правило, что ключевых клиентов ведёт первое лицо."]}, {"c": "portfolio", "t": "Собственник хочет открыть новое направление", "s": "Собственник загорелся идеей выйти в клининг: «те же люди, те же клиенты». Просит запустить за квартал. Ваш анализ говорит: другие процессы, другое оборудование, другая конкуренция, цена входа около 20 млн, окупаемость не раньше чем через два года. Как ведёте разговор и что предлагаете?", "ref": ["Не спорить с идеей, а показать расчёт: цена входа, окупаемость, что отвлечёт от основного бизнеса.", "Разложить «те же клиенты»: у скольких текущих клиентов есть реальная потребность и кто у них это уже делает.", "Предложить пилот: один клиент, один объект, субподряд вместо собственной службы, три месяца, критерий успеха.", "Сценарии: что будет с основным бизнесом, если 20 млн уйдут туда.", "Если собственник настаивает после расчётов, зафиксировать риски письменно и назначить точку остановки.", "Идея записывается в портфель с датой пересмотра, а не отвергается навсегда."]}, {"c": "topteam", "t": "Сильный директор, которого все боятся", "s": "Директор по операциям даёт лучшие показатели за три года: невыходы упали вдвое, маржа выросла. При этом за год от него ушли четыре координатора, два руководителя отделов отказываются с ним работать, HR приносит жалобы. Собственник говорит: «Результат есть, остальное лирика». Ваше решение?", "ref": ["Разделить результат и способ: результат, который держится на страхе, уходит вместе с людьми." function newDayIfNeeded(){
  if (state.day.date === today()) return;
  if (state.streak.last) {

    if (gap > 1) { if (state.streak.count > 1) pushLog("Серия прервана: " + state.streak.count + " дн."); state.streak.count = 0; }
  }
  state.day = { date:today(), cards:[], applied:[] };
  save();
}
function pickCard(){
  var order = weakest();
  var usedToday = state.day.cards.map(function(t){
    var c = CARDS.find(function(x){ return x.t === t; }); return c ? c.c : "";
  });
  function fromComp(id){
    return CARDS.filter(function(c){
      return c.c === id && state.seen.indexOf(c.t) < 0 && state.day.cards.indexOf(c.t) < 0;
    })[0];
  }
  for (var i = 0; i < order.length; i++)             /* сначала слабая зона, которой сегодня ещё не было */
    if (usedToday.indexOf(order[i].id) < 0) { var c1 = fromComp(order[i].id); if (c1) return c1; }
  for (var j = 0; j < order.length; j++) { var c2 = fromComp(order[j].id); if (c2) return c2; }
  var rest = CARDS.filter(function(c){ return state.day.cards.indexOf(c.t) < 0; });
  if (!rest.length) return null;
  state.seen = [];                                   /* круг пройден — начинаем заново */
  state.circle = (state.circle || 1) + 1;
  pushLog("Круг " + (state.circle - 1) + " пройден: все 40 карточек. Начинается круг " + state.circle);
  addXP(100, "полный круг карточек");
  giveBadge("circle" + (state.circle - 1), "Круг " + (state.circle - 1) + " закрыт");
  return rest[0];
}
function takeCard(){
  if (state.day.cards.length >= 3) { toast("Дневная норма закрыта"); return; }
  var c = pickCard();
  if (!c) { toast("Карточки на сегодня кончились"); return; }
  state.day.cards.push(c.t);
  state.seen.push(c.t);
  addXP(10, "карточка: " + c.t);
  if (state.streak.last !== today()) {
    state.streak.count++; state.streak.last = today();
    if (state.streak.count % 7 === 0) addXP(50, "серия " + state.streak.count + " дней");
    if (state.streak.count >= 7) giveBadge("w7", "Неделя без пропуска");

}

function weekKey(){
  var d = new Date(); d.setHours(0,0,0,0);

  var y = d.getFullYear(), jan4 = new Date(y, 0, 4);
  var wk = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return y + "-" + (wk < 10 ? "0" : "") + wk;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(t){
  var d = document.createElement("div");
  d.className = "toast"; d.textContent = t;
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 2600);

/* восхождение по уровням — пять ступеней, пройденные золотом */
function stairs(){
  var idx = levelIdx(), n = LEVELS.length, h = '<div class="stairs">';
  LEVELS.forEach(function(l, i){
    var px = Math.round(14 + (76 - 14) * i / (n - 1));
    h += '<div class="' + (i < idx ? "on" : i === idx ? "cur" : "") + '" style="height:' + px + 'px" title="' + esc(l.name) + '"></div>';
  });
  return h + '</div>';
}

function radar(){
  var cx = 148, cy = 146, R = 116, n = COMPS.length, out = "";
  for (var g = 1; g <= 5; g++) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = -Math.PI/2 + i * 2*Math.PI/n, r = R * g/5;
      pts.push((cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1));
    }
    out += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="' + (g === 4 ? "#0E0E0E" : "#E4E1DA") +
           '" stroke-width="1"' + (g === 4 ? ' stroke-dasharray="2 5"' : '') + '/>';
  }
  var p = [], marks = "";
  for (var i = 0; i < n; i++) {
    var a = -Math.PI/2 + i * 2*Math.PI/n, sc = scoreOf(COMPS[i].id), r = R * sc/5;
    var x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
    p.push(x.toFixed(1) + "," + y.toFixed(1));
    out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R*Math.cos(a)).toFixed(1) + '" y2="' +
           (cy + R*Math.sin(a)).toFixed(1) + '" stroke="#EFEDE7" stroke-width="1"/>';
    marks += '<rect x="' + (x-3).toFixed(1) + '" y="' + (y-3).toFixed(1) + '" width="6" height="6" fill="#0E0E0E"/>';
    var lr = R + 22, lx = cx + lr*Math.cos(a), ly = cy + lr*Math.sin(a);
    var anchor = Math.abs(Math.cos(a)) < 0.3 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    marks += '<text x="' + lx.toFixed(0) + '" y="' + (ly - 1).toFixed(0) + '" text-anchor="' + anchor +
             '" font-size="9" letter-spacing="1.6" font-weight="700" fill="#8A8A8A">' +
             COMPS[i].name.split(" ")[0].toUpperCase() + '</text>' +
             '<text x="' + lx.toFixed(0) + '" y="' + (ly + 15).toFixed(0) + '" text-anchor="' + anchor +
             '" font-size="15" font-weight="700" letter-spacing="-0.5" fill="#0E0E0E">' + sc.toFixed(1) + '</text>';
  }
  out += '<polygon points="' + p.join(" ") + '" fill="rgba(212,175,55,.30)" stroke="#B8912F" stroke-width="2.5"/>' + marks;
  return '<svg viewBox="-56 -14 408 326" style="width:100%;display:block;margin:4px auto 0">' + out + '</svg>';
}

      '<p class="body" style="margin:12px 0 0">' + v[bandOf(s)] + '</p>' +
      '<div class="act" style="margin-top:14px"><div class="eyebrow gold">С чего начать</div>' +
      '<div style="margin-top:8px;font-size:16px;line-height:1.45">' + v.fix + '</div></div></div>';
  });
  h += '</div>';

  h += '<div class="sec"><h2>На что опираться</h2>';
  strong.forEach(function(c){
    var s = scoreOf(c.id);
    h += '<div style="padding:16px 0;border-bottom:1px solid #E4E1DA">' +
      '<div class="row"><span style="font-size:17px;font-weight:700;letter-spacing:-.02em">' + c.full + '</span>' +
      '<span class="mid">' + s.toFixed(1) + '</span></div>' +
      '<p class="body muted" style="margin:8px 0 0">' + VERDICTS[c.id][bandOf(s)] + '</p></div>';
  });
  h += '</div>';

  h += '<div class="sec"><h2>Что дальше</h2>' +
    '<div class="kv"><span>Каждый день</span><span>3 карточки по провалам</span></div>' +
    '<div class="kv"><span>Через две недели</span><span>первый босс-кейс</span></div>' +
    '<div class="kv"><span>Через квартал</span><span>повторный срез и сравнение</span></div>' +
    '<button class="primary wide" onclick="ui.result=false;ui.tab=\'today\';render()">Перейти к плану</button></div>';
  return h;
}

function tabs(){
  var t = [["today","Сегодня"],["practice","Практика"],["map","Карта"],["rewards","Награды"],["progress","Прогресс"]];
  return '<div class="tabs">' + t.map(function(x){
    return '<button class="' + (ui.tab === x[0] ? "on" : "") + '" onclick="ui.tab=\'' + x[0] + '\';ui.bossOpen=false;render()">' +
           x[1] + '</button>';
  }).join("") + '</div>';
}

function render(){
  var h;
  var inQuiz = ui.retake || (!state.scores && (ui.started || state.qi > 0 || state.answers.length > 0));
  if (inQuiz) h = screenQuiz();
  else if (ui.result && state.scores) h = screenResult();
  else if (!state.scores) h = screenIntro();
  else {
    newDayIfNeeded();
    h = ui.tab === "map" ? tabMap() : ui.tab === "rewards" ? tabRewards() : ui.tab === "practice" ? tabPractice() :
        ui.tab === "progress" ? tabProgress() : tabToday();
    h = tabs() + '<div class="page">' + h + '</div>';
    document.getElementById("app").innerHTML = h;
    window.scrollTo(0, 0);
    return;
  }
  h = '<div class="page">' + h + '</div>';
  document.getElementById("app").innerHTML = h;
}

var lastWake = 0;
function wakeUp(){
  if (Date.now() - lastWake < 20000) return;
  lastWake = Date.now();
  newDayIfNeeded(); newWeekIfNeeded(); render();
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") wakeUp(); });
window.addEventListener("focus", wakeUp);

applyTier();
render();
</script>
