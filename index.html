/* ─────────── УРОВНИ, НАГРАДЫ ─────────── */
var LEVELS = [
  {xp:0,    name:"Руководитель отдела"},
  {xp:250,  name:"Head of Marketing"},
  {xp:700,  name:"Директор по маркетингу"},
  {xp:1500, name:"CMO"},
  {xp:2600, name:"CMO уровня совета"}
];
var DEFAULT_REWARDS = [
  {id:1, name:"Час на себя без чувства вины", cost:60},
  {id:2, name:"Книга по подписке или на бумаге", cost:120},
  {id:3, name:"Профессиональная конференция", cost:400},
  {id:4, name:"Спа или массаж", cost:250},
  {id:5, name:"Выходной без единого рабочего чата", cost:600}
];

/* ─────────── СОСТОЯНИЕ ─────────── */
function today(){ return new Date().toLocaleDateString("ru-RU"); }
function parseD(s){ var p = (s||"").split("."); return p.length===3 ? new Date(+p[2], +p[1]-1, +p[0]) : null; }
function daysBetween(a, b){ var x = parseD(a), y = parseD(b); return (!x||!y) ? 0 : Math.round((y-x)/86400000); }
function defState(){
  return { v:1, scores:null, quizAt:null, quizHistory:[], answers:[], qi:0,
           xp:0, spent:0, streak:{count:0, last:null},
           day:{date:null, cards:[], applied:[]},
           practice:{}, badges:[], log:[], bossAt:null, bossLog:[], seen:[],
           rewards:DEFAULT_REWARDS.slice(), bought:[] };
}
function load(){
  try {
    var raw = localStorage.getItem(LSKEY);
    if (!raw) return defState();
    var s = JSON.parse(raw), d = defState();
    for (var k in d) if (!(k in s)) s[k] = d[k];
    return s;
  } catch(e){ return defState(); }
}
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch(e){} }
var state = load();
var ui = { tab:"today", card:null, bossOpen:false, bossText:"", showRef:false, addReward:false };

/* ─────────── ПРОГРЕСС И УРОВНИ ─────────── */
function balance(){ return state.xp - state.spent; }
function levelIdx(){ var i = 0; LEVELS.forEach(function(l, n){ if (state.xp >= l.xp) i = n; }); return i; }
function nextLevel(){ return LEVELS[levelIdx()+1] || null; }
function addXP(n, why){
  state.xp += n;
  var before = levelIdx();
  pushLog("+" + n + " XP · " + why);
  if (levelIdx() > before) toast("Новый уровень: " + LEVELS[levelIdx()].name);
}
function pushLog(t){ state.log.unshift({ d:today(), t:t }); state.log = state.log.slice(0, 60); }

/* оценка компетенции = ассессмент + практика (0.1 за применённое действие, максимум +1.5) */
function scoreOf(id){
  if (!state.scores) return 0;
  var grow = Math.min((state.practice[id] || 0) * 0.1, 1.5);
  return Math.min(5, state.scores[id] + grow);
}
function growthOf(id){ return Math.min((state.practice[id] || 0) * 0.1, 1.5); }
function weakest(){
  return COMPS.slice().sort(function(a, b){ return scoreOf(a.id) - scoreOf(b.id); });
}

/* ─────────── АССЕССМЕНТ ─────────── */
function answer(points){
  state.answers.push(points);
  state.qi++;
  if (state.qi >= QUIZ.length) finishQuiz(); else save();
  render();
}
function finishQuiz(){
  var sum = {}, cnt = {};
  QUIZ.forEach(function(q, i){
    sum[q.c] = (sum[q.c] || 0) + (state.answers[i] || 0);
    cnt[q.c] = (cnt[q.c] || 0) + 1;
  });
  var sc = {};
  COMPS.forEach(function(c){ sc[c.id] = Math.round((sum[c.id] / cnt[c.id]) * 10) / 10; });
  if (state.scores) state.quizHistory.push({ d:state.quizAt, scores:state.scores });
  state.scores = sc; state.quizAt = today(); state.answers = []; state.qi = 0;
  addXP(50, "срез компетенций пройден");
  giveBadge("start", "Точка отсчёта");
  if (state.quizHistory.length) giveBadge("remeasure", "Замер прогресса");
  save();
}
function restartQuiz(){
  if (!confirm("Пройти срез заново? Текущие оценки уйдут в историю, рост от практики обнулится.")) return;
  state.answers = []; state.qi = 0; state.practice = {};
  save(); render();
}

/* ─────────── ДЕНЬ ─────────── */
function newDayIfNeeded(){
  if (state.day.date === today()) return;
  if (state.streak.last) {
    var gap = daysBetween(state.streak.last, today());
    if (gap > 1) { if (state.streak.count > 1) pushLog("Серия прервана: " + state.streak.count + " дн."); state.streak.count = 0; }
  }
  state.day = { date:today(), cards:[], applied:[] };
  save();
}
function pickCard(){
  var order = weakest();
  var usedToday = state.day.cards.map(function(t){
    var c = CARDS.find(function(x){ return x.t === t; }); return c ? c.c : "";
  });
  function fromComp(id){
    return CARDS.filter(function(c){
      return c.c === id && state.seen.indexOf(c.t) < 0 && state.day.cards.indexOf(c.t) < 0;
    })[0];
  }
  for (var i = 0; i < order.length; i++)             /* сначала слабая зона, которой сегодня ещё не было */
    if (usedToday.indexOf(order[i].id) < 0) { var c1 = fromComp(order[i].id); if (c1) return c1; }
  for (var j = 0; j < order.length; j++) { var c2 = fromComp(order[j].id); if (c2) return c2; }
  var rest = CARDS.filter(function(c){ return state.day.cards.indexOf(c.t) < 0; });
  if (!rest.length) return null;
  state.seen = [];                                   /* круг пройден — начинаем заново */
  return rest[0];
}
function takeCard(){
  if (state.day.cards.length >= 3) { toast("Дневная норма закрыта"); return; }
  var c = pickCard();
  if (!c) { toast("Карточки на сегодня кончились"); return; }
  state.day.cards.push(c.t);
  state.seen.push(c.t);
  addXP(10, "карточка: " + c.t);
  if (state.streak.last !== today()) {
    state.streak.count++; state.streak.last = today();
    if (state.streak.count % 7 === 0) addXP(50, "серия " + state.streak.count + " дней");
    if (state.streak.count >= 7) giveBadge("w7", "Неделя без пропуска");
    if (state.streak.count >= 30) giveBadge("w30", "Месяц дисциплины");
  }
  save(); render();
}
function markApplied(title){
  if (state.day.applied.indexOf(title) >= 0) return;
  var card = CARDS.find(function(c){ return c.t === title; });
  state.day.applied.push(title);
  state.practice[card.c] = (state.practice[card.c] || 0) + 1;
  addXP(25, "действие применено: " + title);
  if (state.practice[card.c] >= 5) giveBadge("p_" + card.c, "Практик: " + comp(card.c).name);
  if (state.practice[card.c] >= 15) giveBadge("m_" + card.c, "Мастер: " + comp(card.c).name);
  save(); render();
  toast("+25 XP · " + comp(card.c).name);
}
function giveBadge(id, name){
  if (state.badges.some(function(b){ return b.id === id; })) return;
  state.badges.push({ id:id, name:name, d:today() });
  toast("Бейдж: " + name);
}

/* ─────────── БОСС-КЕЙС ─────────── */
function bossDue(){
  if (!state.scores) return false;
  if (!state.bossAt) return true;
  return daysBetween(state.bossAt, today()) >= 14;
}
function currentBoss(){
  var used = state.bossLog.map(function(b){ return b.t; });
  var weak = weakest();
  for (var i = 0; i < weak.length; i++) {
    var b = BOSS.find(function(x){ return x.c === weak[i].id && used.indexOf(x.t) < 0; });
    if (b) return b;
  }
  return BOSS[0];
}
function submitBoss(){
  var b = currentBoss();
  var txt = document.getElementById("bossText") ? document.getElementById("bossText").value : "";
  if (txt.trim().length < 40) { toast("Напишите развёрнутый ответ"); return; }
  ui.bossText = txt; ui.showRef = true;
  render();
}
function closeBoss(selfScore){
  var b = currentBoss();
  state.bossLog.unshift({ t:b.t, c:b.c, d:today(), text:ui.bossText, score:selfScore });
  state.bossAt = today();
  state.practice[b.c] = (state.practice[b.c] || 0) + (selfScore >= 4 ? 3 : 1);
  addXP(60, "босс-кейс: " + b.t);
  giveBadge("boss1", "Первый босс-кейс");
  if (state.bossLog.length >= 5) giveBadge("boss5", "Пять босс-кейсов");
  ui.bossOpen = false; ui.showRef = false; ui.bossText = "";
  save(); render();
}

/* ─────────── НАГРАДЫ ─────────── */
function buy(id){
  var r = state.rewards.find(function(x){ return x.id === id; });
  if (!r || balance() < r.cost) return;
  if (!confirm("Забрать награду «" + r.name + "» за " + r.cost + " XP?")) return;
  state.spent += r.cost;
  state.bought.unshift({ name:r.name, cost:r.cost, d:today() });
  pushLog("Награда получена: " + r.name);
  save(); render();
  toast("Заслужено. Заберите награду сегодня");
}
function addReward(){
  var n = document.getElementById("rwName").value.trim();
  var c = parseInt(document.getElementById("rwCost").value, 10);
  if (!n || !c || c < 1) { toast("Название и цена"); return; }
  state.rewards.push({ id:Date.now(), name:n, cost:c });
  ui.addReward = false; save(); render();
}
function delReward(id){
  state.rewards = state.rewards.filter(function(r){ return r.id !== id; });
  save(); render();
}

/* ─────────── ИНТЕРФЕЙС ─────────── */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(t){
  var d = document.createElement("div");
  d.className = "toast"; d.textContent = t;
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
}
function radar(){
  var cx = 140, cy = 138, R = 104, n = COMPS.length, out = "";
  out += '<defs><radialGradient id="rg" cx="50%" cy="50%"><stop offset="0%" stop-color="#FFB020" stop-opacity=".38"/>' +
         '<stop offset="100%" stop-color="#FF6B4A" stop-opacity=".14"/></radialGradient></defs>';
  for (var g = 1; g <= 5; g++) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = -Math.PI/2 + i * 2*Math.PI/n, r = R * g/5;
      pts.push((cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1));
    }
    out += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="' + (g === 4 ? "rgba(255,176,32,.32)" : "rgba(255,255,255,.07)") +
           '" stroke-width="1"' + (g === 4 ? ' stroke-dasharray="3 4"' : '') + '/>';
  }
  var p = [], dots = "";
  for (var i = 0; i < n; i++) {
    var a = -Math.PI/2 + i * 2*Math.PI/n, sc = scoreOf(COMPS[i].id), r = R * sc/5;
    var x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
    p.push(x.toFixed(1) + "," + y.toFixed(1));
    out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R*Math.cos(a)).toFixed(1) + '" y2="' +
           (cy + R*Math.sin(a)).toFixed(1) + '" stroke="rgba(255,255,255,.05)" stroke-width="1"/>';
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.4" fill="' + COMPS[i].color + '"/>';
    var lr = R + 19, lx = cx + lr*Math.cos(a), ly = cy + lr*Math.sin(a);
    var anchor = Math.abs(Math.cos(a)) < 0.3 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    dots += '<text x="' + lx.toFixed(0) + '" y="' + (ly + 2).toFixed(0) + '" text-anchor="' + anchor +
            '" font-size="9" letter-spacing="1.1" font-weight="700" fill="' + COMPS[i].color + '" opacity=".9">' +
            COMPS[i].name.split(" ")[0].toUpperCase() + '</text>' +
            '<text x="' + lx.toFixed(0) + '" y="' + (ly + 13).toFixed(0) + '" text-anchor="' + anchor +
            '" font-size="9.5" font-weight="600" fill="#7C879E">' + sc.toFixed(1) + '</text>';
  }
  out += '<polygon points="' + p.join(" ") + '" fill="url(#rg)" stroke="#FFB020" stroke-width="2" stroke-linejoin="round"/>' + dots;
  return '<svg viewBox="-52 -10 384 302" style="width:100%;max-width:370px;display:block;margin:2px auto 0">' + out + '</svg>';
}
function ring(pct){
  var r = 21, c = 2 * Math.PI * r;
  return '<svg class="ring" width="52" height="52" viewBox="0 0 52 52">' +
    '<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB020"/>' +
    '<stop offset="1" stop-color="#FF6B4A"/></linearGradient></defs>' +
    '<circle cx="26" cy="26" r="' + r + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>' +
    '<circle cx="26" cy="26" r="' + r + '" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - pct/100)).toFixed(1) +
    '" transform="rotate(-90 26 26)"/>' +
    '<text x="26" y="30" text-anchor="middle" font-size="12.5" font-weight="750" fill="#EEF1F8">' + pct + '</text></svg>';
}
function header(){
  var l = LEVELS[levelIdx()], nx = nextLevel();
  var pct = nx ? Math.max(0, Math.min(100, Math.round((state.xp - l.xp) / (nx.xp - l.xp) * 100))) : 100;
  return '<div class="eyebrow">Путь к директору по маркетингу</div>' +
    '<div class="logo">ВЕК<span>ТОР</span></div>' +
    '<div class="card tight"><div class="row" style="gap:14px">' + ring(pct) +
    '<div style="flex:1;min-width:0">' +
      '<div class="lvl">' + l.name + '</div>' +
      '<div class="small muted" style="margin:3px 0 8px">' + state.xp + ' XP' +
        (nx ? ' · до «' + nx.name + '» ещё ' + (nx.xp - state.xp) : ' · вершина шкалы') + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '</div></div>' +
    '<div class="row small" style="margin-top:13px">' +
      '<span class="muted">Серия <b style="color:#FFC65C">' + state.streak.count + '</b> дн.</span>' +
      '<span class="muted">На награды <b style="color:#FFC65C">' + balance() + '</b> XP</span>' +
    '</div></div>';
}

function screenQuiz(){
  var q = QUIZ[state.qi], c = comp(q.c);
  var pct = Math.round(state.qi / QUIZ.length * 100);
  var h = '<div class="eyebrow">Срез компетенций</div><div class="logo">ВЕК<span>ТОР</span></div>';
  h += '<div class="card fade"><div class="row small"><span class="dim">' + (state.qi+1) + ' / ' + QUIZ.length + '</span>' +
       '<span class="pill" style="color:' + c.color + ';border-color:' + c.color + '33;background:' + c.color + '14">' + c.name + '</span></div>' +
       '<div class="bar" style="margin:11px 0 20px"><i style="width:' + pct + '%"></i></div>' +
       '<div class="qtext">' + esc(q.q) + '</div>';
  q.o.forEach(function(o, i){
    h += '<button class="opt" onclick="answer(' + o[1] + ')"><b>' + "АБВГ".charAt(i) + '</b><span>' + esc(o[0]) + '</span></button>';
  });
  h += '<div class="small dim" style="margin-top:12px">Отвечайте как поступаете сейчас, а не как правильно. Смысл среза — найти провалы.</div></div>';
  return h;
}
function screenIntro(){
  return '<div class="eyebrow">Путь к директору по маркетингу</div><div class="logo">ВЕК<span>ТОР</span></div>' +
    '<div class="card"><h2>С чего начинаем</h2>' +
    '<p style="margin:0 0 12px">40 рабочих ситуаций по восьми компетенциям CMO. Без самооценки: только выбор действия. На выходе — радар сильных и провальных зон и приоритеты на квартал.</p>' +
    '<div class="kv"><span class="muted">Время</span><span>15 минут</span></div>' +
    '<div class="kv"><span class="muted">Дальше</span><span>10 минут в день</span></div>' +
    '<div class="kv"><span class="muted">Награда за срез</span><span>50 XP</span></div>' +
    '<button class="primary wide" onclick="state.qi=0;state.answers=[];save();render()">Начать срез</button></div>' +
    '<div class="card"><h2>Как устроено</h2>' +
    '<p class="small muted" style="margin:0">Каждый день приложение даёт карточку по вашей самой слабой компетенции и одно микро-действие в реальной работе. XP начисляется за применение, а не за чтение. Раз в две недели — босс-кейс: развёрнутая ситуация без вариантов ответа.</p></div>';
}

function tabToday(){
  var h = header();
  if (bossDue() && !ui.bossOpen) {
    h += '<div class="card" style="border-color:#C792EA"><div class="row"><h2 style="margin:0;color:#C792EA">Босс-кейс доступен</h2>' +
         '<span class="small muted">+60 XP</span></div>' +
         '<p class="small" style="margin:10px 0 0">' + esc(currentBoss().t) + ' — развёрнутая ситуация, ответ текстом.</p>' +
         '<button class="wide" onclick="ui.bossOpen=true;render()">Открыть кейс</button></div>';
  }
  if (ui.bossOpen) return h + bossBlock();

  var w = weakest()[0];
  h += '<div class="card"><div class="row"><h2 style="margin:0">Сегодня</h2>' +
       '<span class="small muted">' + state.day.cards.length + ' из 3</span></div>' +
       '<div class="small muted" style="margin:10px 0 0">Фокус дня: <span style="color:' + w.color + '">' + w.full + '</span> — сейчас самая слабая зона.</div></div>';

  state.day.cards.forEach(function(t){
    var c = CARDS.find(function(x){ return x.t === t; }), k = comp(c.c), done = state.day.applied.indexOf(t) >= 0;
    h += '<div class="card fade"><span class="pill" style="color:' + k.color + ';border-color:' + k.color + '33;background:' + k.color + '14">' + k.name + '</span>' +
         '<h3 class="cardTitle">' + esc(c.t) + '</h3>' +
         '<p style="margin:0 0 14px;color:#C6CDDC">' + esc(c.b) + '</p>' +
         '<div class="act"><div class="eyebrow" style="color:#FFB020;margin-bottom:6px">Действие на сегодня</div>' +
         esc(c.a) + '</div>' +
         (done ? '<div class="grow" style="margin-top:13px">✓ Применено · +25 XP в ' + k.name.toLowerCase() + '</div>'
               : '<button class="primary wide" onclick="markApplied(\'' + esc(c.t).replace(/'/g,"\\'") + '\')">Применила в работе · +25 XP</button>') +
         '</div>';
  });

  if (state.day.cards.length < 3)
    h += '<button class="primary wide" onclick="takeCard()" style="margin-bottom:14px">' +
         (state.day.cards.length ? "Ещё карточка" : "Карточка дня · +10 XP") + '</button>';
  else
    h += '<div class="card small muted" style="text-align:center">Дневная норма закрыта. Возвращайтесь завтра.</div>';
  return h;
}

function bossBlock(){
  var b = currentBoss(), c = comp(b.c);
  var h = '<div class="card"><span class="pill" style="color:' + c.color + ';border-color:' + c.color + '">' + c.name + '</span>' +
    '<h3 style="font-size:18px;margin:10px 0 10px">' + esc(b.t) + '</h3>' +
    '<p style="margin:0 0 14px">' + esc(b.s) + '</p>';
  if (!ui.showRef) {
    h += '<textarea id="bossText" placeholder="Ваш разбор: решение, на что опираетесь, что говорите совету">' + esc(ui.bossText) + '</textarea>' +
      '<button class="primary wide" onclick="submitBoss()">Сверить с эталоном</button>' +
      '<button class="ghost wide" onclick="ui.bossOpen=false;render()">Позже</button></div>';
    return h;
  }
  h += '<div class="card tight" style="background:#0F141D"><div class="eyebrow" style="margin-bottom:8px">Ваш ответ</div>' +
       '<div class="small">' + esc(ui.bossText).replace(/\n/g, "<br/>") + '</div></div>';
  h += '<div class="eyebrow" style="margin:16px 0 8px">Эталон: что должно прозвучать</div><ul style="margin:0;padding-left:18px">';
  b.ref.forEach(function(r){ h += '<li style="margin-bottom:7px">' + esc(r) + '</li>'; });
  h += '</ul><div class="eyebrow" style="margin:16px 0 8px">Сколько пунктов вы назвали?</div><div class="row">';
  [1,2,3,4,5].forEach(function(n){ h += '<button style="flex:1" onclick="closeBoss(' + n + ')">' + n + '</button>'; });
  h += '</div></div>';
  return h;
}

function tabMap(){
  var h = header() + '<div class="card"><h2>Карта компетенций</h2>' + radar() +
    '<div class="small muted" style="text-align:center;margin-top:6px">Планка директора по маркетингу — 4 из 5 по каждой оси</div></div>';
  h += '<div class="card"><h2>Приоритеты квартала</h2>';
  weakest().slice(0, 3).forEach(function(c, i){
    h += '<div class="kv"><span><b style="color:' + c.color + '">' + (i+1) + '. ' + c.full + '</b></span>' +
         '<span>' + scoreOf(c.id).toFixed(1) + '</span></div>';
  });
  h += '<div class="small muted" style="margin-top:10px">Карточки дня приходят по этим зонам, пока они не подтянутся.</div></div>';
  h += '<div class="card"><h2>Все компетенции</h2>';
  COMPS.forEach(function(c){
    var s = scoreOf(c.id), g = growthOf(c.id);
    h += '<div style="margin-bottom:12px"><div class="row small"><span>' + c.full + '</span>' +
      '<span>' + s.toFixed(1) + (g > 0 ? ' <span class="grow">+' + g.toFixed(1) + '</span>' : '') + '</span></div>' +
      '<div class="bar" style="margin-top:5px"><i style="width:' + (s/5*100) + '%;background:' + c.color + '"></i></div></div>';
  });
  h += '<hr/><div class="small muted">Срез пройден: ' + (state.quizAt || "—") +
       '. Рост от практики: +0.1 за применённое действие, максимум +1.5 до следующего среза.</div>' +
       '<button class="ghost wide" onclick="restartQuiz()">Пройти срез заново</button></div>';
  if (state.quizHistory.length) {
    h += '<div class="card"><h2>История срезов</h2>';
    state.quizHistory.slice().reverse().forEach(function(q){
      var avg = COMPS.reduce(function(a, c){ return a + q.scores[c.id]; }, 0) / COMPS.length;
      h += '<div class="kv"><span class="muted">' + q.d + '</span><span>средний ' + avg.toFixed(1) + '</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function tabRewards(){
  var h = header() + '<div class="card"><div class="row"><h2 style="margin:0">Магазин наград</h2>' +
    '<span class="lvl">' + balance() + ' XP</span></div>' +
    '<div class="small muted" style="margin:10px 0 14px">XP тратится здесь, но уровень не падает. Награда должна быть настоящей — иначе механика не работает.</div>';
  state.rewards.forEach(function(r){
    var can = balance() >= r.cost;
    h += '<div class="kv"><span>' + esc(r.name) + '<br/><span class="small muted">' + r.cost + ' XP</span></span>' +
      '<span><button ' + (can ? '' : 'disabled ') + 'onclick="buy(' + r.id + ')">' + (can ? "Забрать" : "Копим") + '</button> ' +
      '<button class="ghost" onclick="delReward(' + r.id + ')">✕</button></span></div>';
  });
  if (ui.addReward) {
    h += '<hr/><input type="text" id="rwName" placeholder="Название награды"/>' +
      '<input type="number" id="rwCost" placeholder="Цена в XP" style="margin-top:8px"/>' +
      '<button class="primary wide" onclick="addReward()">Добавить</button>';
  } else {
    h += '<button class="ghost wide" onclick="ui.addReward=true;render()">+ Своя награда</button>';
  }
  h += '</div>';
  if (state.bought.length) {
    h += '<div class="card"><h2>Получено</h2>';
    state.bought.slice(0, 10).forEach(function(b){
      h += '<div class="kv"><span>' + esc(b.name) + '</span><span class="muted small">' + b.d + '</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function tabProgress(){
  var h = header();
  var appliedTotal = Object.keys(state.practice).reduce(function(a, k){ return a + state.practice[k]; }, 0);
  h += '<div class="card"><h2>Итоги</h2>' +
    '<div class="kv"><span class="muted">Применённых действий</span><span>' + appliedTotal + '</span></div>' +
    '<div class="kv"><span class="muted">Босс-кейсов пройдено</span><span>' + state.bossLog.length + '</span></div>' +
    '<div class="kv"><span class="muted">Серия</span><span>' + state.streak.count + ' дн.</span></div>' +
    '<div class="kv"><span class="muted">Всего XP</span><span>' + state.xp + '</span></div></div>';
  h += '<div class="card"><h2>Бейджи</h2>';
  var all = [{id:"start",name:"Точка отсчёта"},{id:"w7",name:"Неделя без пропуска"},{id:"w30",name:"Месяц дисциплины"},
             {id:"boss1",name:"Первый босс-кейс"},{id:"boss5",name:"Пять босс-кейсов"},{id:"remeasure",name:"Замер прогресса"}];
  COMPS.forEach(function(c){ all.push({id:"p_" + c.id, name:"Практик: " + c.name}); });
  all.forEach(function(b){
    var has = state.badges.some(function(x){ return x.id === b.id; });
    h += '<span class="badge ' + (has ? 'on' : 'off') + '">' + b.name + '</span>';
  });
  h += '</div>';
  if (state.bossLog.length) {
    h += '<div class="card"><h2>Разборы кейсов</h2>';
    state.bossLog.forEach(function(b){
      h += '<div class="kv"><span>' + esc(b.t) + '<br/><span class="small muted">' + b.d + '</span></span><span>' + b.score + '/5</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><h2>Журнал</h2>';
  if (!state.log.length) h += '<div class="small muted">Пусто</div>';
  state.log.slice(0, 20).forEach(function(l){
    h += '<div class="kv small"><span>' + esc(l.t) + '</span><span class="dim">' + l.d + '</span></div>';
  });
  h += '</div><div class="small dim" style="text-align:center;margin-bottom:10px">Вектор v' + APP_VERSION + '</div>';
  return h;
}

var ICONS = {
  today:   '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>',
  map:     '<path d="M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z"/><path d="M12 8.5l3.5 2v4l-3.5 2-3.5-2v-4z"/>',
  rewards: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>',
  progress:'<path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M21 19H3"/>'
};
function tabs(){
  var t = [["today","Сегодня"],["map","Карта"],["rewards","Награды"],["progress","Прогресс"]];
  return '<div class="tabs">' + t.map(function(x){
    return '<button class="' + (ui.tab === x[0] ? "on" : "") + '" onclick="ui.tab=\'' + x[0] + '\';ui.bossOpen=false;render()">' +
           '<svg viewBox="0 0 24 24">' + ICONS[x[0]] + '</svg>' + x[1] + '</button>';
  }).join("") + '</div>';
}

function render(){
  var h;
  if (!state.scores && state.qi === 0 && !state.answers.length) h = screenIntro();
  else if (!state.scores) h = screenQuiz();
  else {
    newDayIfNeeded();
    h = ui.tab === "map" ? tabMap() : ui.tab === "rewards" ? tabRewards() :
        ui.tab === "progress" ? tabProgress() : tabToday();
    h += tabs();
  }
  document.getElementById("app").innerHTML = h;
}

var lastWake = 0;
function wakeUp(){
  if (Date.now() - lastWake < 20000) return;
  lastWake = Date.now();
  newDayIfNeeded(); render();
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") wakeUp(); });
window.addEventListener("focus", wakeUp);

render();
</script>
